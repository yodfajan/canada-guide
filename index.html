function quizScore(){
  const sc = {a:0,b:0,c:0}, mx = {a:0,b:0,c:0}; let city = null, n = 0;
  QUIZ.forEach(q => {
    for (const k of ['a','b','c']) mx[k] += Math.max(...q.o.map(o => o[k] || 0));
    const i = S.quiz[q.id];
    if (i != null && q.o[i]) { n++; for (const k of ['a','b','c']) sc[k] += q.o[i][k] || 0; if (q.o[i].city) city = q.o[i].city; }
  });
  const pct = {a:Math.round(sc.a/mx.a*100), b:Math.round(sc.b/mx.b*100), c:Math.round(sc.c/mx.c*100)};
  const rank = ['a','b','c'].sort((x, y) => pct[y] - pct[x]);
  return {pct, rank, city, n, done:n===QUIZ.length};
}
function viewQuiz(){
  const Q = QUIZ_UI, r = quizScore();
  const qs = QUIZ.map((q,qi) => `
    <div class="card">
      <div class="flex items-center gap-2 mb-2"><span class="badge b-gray">${ic(q.icon,'icon-sm')}${T(q.cat)}</span><span class="faint text-[13px] num">${qi+1} / ${QUIZ.length}</span></div>
      <h3 class="text-[17px] font-semibold mb-3">${T(q.q)}</h3>
      <div class="grid gap-2">${q.o.map((o,oi) => `<button class="opt ${S.quiz[q.id]===oi?'on':''}" data-act="quiz" data-q="${q.id}" data-o="${oi}" aria-pressed="${S.quiz[q.id]===oi}">${T(o.l)}</button>`).join('')}</div>
    </div>`).join('');
  let res;
  if (!r.done) {
    res = `<p class="muted">${T(Q.pending)}</p>`;
  } else {
    const [k1, k2] = r.rank, close = r.pct[k1] - r.pct[k2] < 8;
    const rec = {a:Q.recA, b:Q.recB, c:Q.recC}[k1];
    const sc = k1 === 'a' ? 'safe' : 'one';
    const bars = [['a', Q.fitA, 'var(--amber)'], ['b', Q.fitB, 'var(--green)'], ['c', Q.fitC, 'var(--blue)']];
    res = `
      <h3 class="text-[22px] font-semibold">${T(rec.t)}</h3>
      <p class="muted mt-2 text-[15px]">${T(rec.d)}</p>
      ${close ? `<p class="text-[14.5px] mt-3 flex gap-2" style="background:var(--amber-soft);border-radius:10px;padding:8px 12px">${ic('scale','icon-sm')}<span>${T(Q.close)(T({a:Q.nA, b:Q.nB, c:Q.nC}[k2]))}</span></p>` : ''}
      <div class="mt-5 grid gap-3">
        
        ${bars.map(([k, l, col]) => `<div><div class="flex justify-between text-[14px] mb-1"><span>${T(l)}</span><span class="num font-semibold">${r.pct[k]}%</span></div><div class="bar"><i style="width:${r.pct[k]}%;background:${col}"></i></div></div>`).join('')}
      </div>
      ${r.city ? `<p class="mt-5 text-[14.5px] flex gap-2"><span style="color:var(--blue)">${ic('map-pin','icon-sm')}</span><span>${T(Q.city[r.city])}</span></p>` : ''}
      <button class="btn btn-primary mt-5" data-act="goroad" data-v="${sc}">${T(Q.go)}${ic('arrow-right','icon-sm')}</button>`;
  }
  return `
    <div class="flex flex-wrap items-end justify-between gap-3 mb-5">
      <div><h2 class="text-[26px] font-semibold">${T(Q.title)}</h2><p class="muted mt-1">${T(Q.sub)}</p></div>
      <button class="btn btn-ghost" data-act="quizreset">${ic('rotate-ccw','icon-sm')}${T(Q.reset)}</button>
    </div>
    <div class="grid lg:grid-cols-3 gap-4 items-start">
      <div class="lg:col-span-2 grid gap-4">${qs}</div>
      <div class="card lg:sticky" style="top:72px">
        
        <div class="flex justify-between text-[14px] mb-2"><span class="muted">${T(Q.progress)}</span><span class="num font-semibold">${r.n} / ${QUIZ.length}</span></div>
        
        <div class="bar mb-5"><i style="width:${r.n/QUIZ.length*100}%"></i></div>
        
        ${res}
      </div>
    </div>`;
}

const PLAN_WIN = [[18,12],[12,9],[9,6],[6,4],[3,1]];   /* months before the intake for each checklist phase */
const isoD = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const plusDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return isoD(d); };
function planIntake(){ const p = S.plan || {}; return new Date(p.y || S.sim.intake || 2027, (p.m || 9) - 1, 1); }
/* Recommended date for every checklist step: spread across its phase window; steps already overdue start from today. */
function planDates(){
  const intake = planIntake(), today = new Date(); today.setHours(0, 0, 0, 0);
  const own = (S.plan && S.plan.dates) || {}, out = {};
  let prev = null;   /* keep open steps in checklist order, at least 2 days apart, never before today */
  CHECK.phases.forEach((ph, pi) => {
    const its = CHECK.items.filter(it => it.ph === pi), [from, to] = PLAN_WIN[pi] || [3, 1];
    its.forEach((it, k) => {
      const d = new Date(intake); d.setDate(d.getDate() - Math.round((from - (from - to) * k / Math.max(1, its.length)) * 30.44));
      let late = false;
      if (!S.check[it.id]) {
        if (d < today) { d.setTime(today.getTime()); late = true; }
        if (prev && d.getTime() < prev + 2 * 864e5) d.setTime(prev + 2 * 864e5);
        prev = d.getTime();
      }
      out[it.id] = own[it.id] ? {date:own[it.id], custom:true, late:false} : {date:isoD(d), custom:false, late};
    });
  });
  return out;
}
function planMilestones(){
  const U = PLAN_UI, intake = planIntake(), own = (S.plan && S.plan.dates) || {}, ms = [];
  const arr = new Date(intake); arr.setDate(arr.getDate() - 14);
  ms.push({id:'m-arrive', t:U.arriveT, d:U.arriveD, date:isoD(arr)}, {id:'m-start', t:U.startT, d:U.startD, date:isoD(intake)});
  if (S.sim.type !== 'private') {
    const g = new Date(intake); g.setMonth(g.getMonth() + planOf(S.sim).length);
    ms.push({id:'m-grad', t:U.gradT, d:U.gradD, date:isoD(g)}, {id:'m-pgwp', t:U.pgwpT, d:U.pgwpD, date:plusDays(isoD(g), 14)});
  }
  return ms.map(m => own[m.id] ? Object.assign(m, {date:own[m.id], custom:true}) : m);
}
const plainT = s => String(s).replace(/\s?\[\[[a-z0-9_]+\]\]/gi, '').replace(/<[^>]+>/g, '').trim();
const guideUrl = () => /^https?:/.test(location.protocol) ? location.origin + location.pathname : '';

function planItem(id){

/* All-day events in one .ics file; lines folded at 75 bytes as the format requires. */
function planIcs(){
  const esc2 = s => plainT(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  const enc = new TextEncoder(), fold = line => { const out = []; let cur = '', bytes = 0;
    for (const ch of line) { const b = enc.encode(ch).length; if (bytes + b > (out.length ? 74 : 75)) { out.push(cur); cur = ''; bytes = 0; } cur += ch; bytes += b; }
    out.push(cur); return out.join('\r\n '); };
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z'), dates = planDates(), link = guideUrl();
  const tag = isoD(planIntake()).slice(0, 7).replace('-', '');   /* stable per step and intake, so a re-import is recognised */
  const ev = (id, title, date, details) => ['BEGIN:VEVENT', 'UID:' + id + '-' + tag + '@canada-guide', 'DTSTAMP:' + stamp,
    'DTSTART;VALUE=DATE:' + date.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + plusDays(date, 1).replace(/-/g, ''),
    'SUMMARY:' + esc2(title), 'DESCRIPTION:' + esc2(plainT(details) + '\n\n' + T(PLAN_UI.from) + (link ? '\n' + link : '')),
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc2(title), 'TRIGGER:-P3D', 'END:VALARM', 'END:VEVENT'];
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Canada Guide//Plan//TH', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:' + esc2(T(PLAN_UI.calName))];
  CHECK.items.forEach((it, i) => lines.push(...ev(it.id, (i + 1) + '. ' + T(it.t), dates[it.id].date, T(it.d) + '\n\n' + T(CHECK.why) + ': ' + T(it.why))));
  planMilestones().forEach(m => lines.push(...ev(m.id, T(m.t), m.date, T(m.d))));
  lines.push('END:VCALENDAR');
  return lines.map(fold).join('\r\n') + '\r\n';
}
function downloadIcs(){

/* Calendar ID from what the user pastes: an address, several addresses, an embed URL or the full iframe code. */
function parseGcalId(raw){
  let s = String(raw || '').trim(); if (!s) return '';
  const m = s.match(/src=["']([^"']+)["']/); if (m) s = m[1];
  if (/calendar\.google\.com\/calendar\/(embed|u\/\d+\/embed)/.test(s)) {
    try { const u = new URL(s.replace(/&amp;/g, '&')); const srcs = u.searchParams.getAll('src'); if (srcs.length) s = srcs.join(','); } catch (e) {}
  }
  try { s = decodeURIComponent(s); } catch (e) {}
  const ids = s.split(',').map(x => x.trim()).filter(Boolean);
  return ids.length && ids.every(x => /^[^\s@<>"']+@[^\s@<>"']+\.[^\s@<>"']+$/.test(x)) ? ids.join(',') : '';
}
function gcalEmbedUrl(){
  const g = S.gcal || {}, ids = String(g.id || '').split(',').filter(Boolean); if (!ids.length) return '';
  let tz = 'Asia/Bangkok'; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch (e) {}
  const mode = innerWidth < 640 ? 'AGENDA' : 'MONTH';   /* Google's own toolbar lets the viewer switch views */
  return 'https://calendar.google.com/calendar/embed?' + ids.map(id => 'src=' + encodeURIComponent(id)).join('&') +
    `&ctz=${encodeURIComponent(tz)}&mode=${mode}&hl=${S.lang === 'th' ? 'th' : 'en'}&wkst=1&showTitle=0&showPrint=0&showCalendars=0&showTz=0`;
}

/* ============================== BUDGET SIMULATOR ============================== */
/* Month plan: S = study term (max 24 h/week off campus), C = paid Co-op term (no weekly limit),
   B = scheduled break between years (full time allowed), G = after graduation (full time only while a PGWP application is pending). */
function planOf(s){
  const P = [], add = (k, n) => { for (let i = 0; i < n; i++) P.push(k); };
  const yrs = s.years === 2 ? 2 : 1;
  if (s.type === 'private') { add('S', 6 * yrs); add('C', 6 * yrs); return P; }
  const coop = s.hasCoop !== false;
  if (yrs === 1) { add('S', 8); add(coop ? 'C' : 'G', 4); }
  else { add('S', 8); add(coop ? 'C' : 'B', 4); add('S', 8); add('G', 4); }
  return P;
}
/* IRCC living-cost amount: read live from the IRCC page (LIVE.funds), else the last known figure. */
const FUNDS_DEF = {amt:23448, eff:'2026-09-01'};
const fundsAmt = () => (LIVE.funds && LIVE.funds.amt) || FUNDS_DEF.amt;
const fundsEff = () => (LIVE.funds && LIVE.funds.eff) || FUNDS_DEF.eff;
/* Yearly IRCC updates expected between the amount's start date and an application in April of the start year */
function proofYears(intake){
  const eff = new Date(fundsEff() + 'T00:00:00'), app = new Date((intake || 2027) + '-04-01T00:00:00');
  return Math.max(0, Math.floor((app - eff) / (365.25 * 864e5)));
}
/* Amounts the user can type in the results: stored as today's price, shown for the start year (value × factor). */
function amtMeta(k, c){
  const s = c.s, ty = c.ty, L0 = SIMC.living[s.living] || SIMC.living.shared, F = c.fac;
  return ({
    tuition:{fac:F.tuition, def:ty.def, v:s.tuition},
    fees:{fac:F.tuition, def:ty.fees, v:val(s.fees, ty.fees)},
    proof:{fac:F.proof, def:fundsAmt(), v:val(s.proof, fundsAmt())},
    travel:{fac:F.cpi, def:SIMC.travel, v:val(s.travel, SIMC.travel)},
    setup:{fac:1, def:SIMC.setup, v:val(s.setup, SIMC.setup)},
    rentC:{fac:F.rent, def:L0.rent, v:val(s.rentC, L0.rent)},
    foodC:{fac:F.cpi, def:L0.food, v:val(s.foodC, L0.food)},
    otherC:{fac:F.cpi, def:L0.other, v:val(s.otherC, L0.other)},
    healthC:{fac:F.health, def:SIMC.health, v:val(s.healthC, SIMC.health)}
  })[k];
}
function amtDefault(k){
  const ty = SIMC.types[S.sim.type];
  if (k === 'tuition') S.sim.tuition = ty.def;
  else if (k === 'fees') S.sim.fees = ty.fees;
  else if (k === 'proof') { S.sim.proofAuto = true; S.sim.proof = fundsAmt(); }
  else if (k === 'travel') S.sim.travel = SIMC.travel;
  else if (k === 'setup') S.sim.setup = SIMC.setup;
  else S.sim[k] = null;
}
/* Share of gross pay that reaches the bank after CPP, EI and income tax withheld (2026 rates, by monthly gross). */
const takeHome = g => g <= 1700 ? 0.93 : g <= 2400 ? 0.89 : g <= 3000 ? 0.84 : g <= 3600 ? 0.82 : 0.80;
const val = (v, d) => (v === undefined || v === null || v === '' || isNaN(v)) ? d : +v;
function simCalc(o){
  const s = Object.assign({}, S.sim, o || {}), ty = SIMC.types[s.type], G = SIMC.growth;
  if (s.type === 'private') s.hasCoop = true;
  const n = Math.max(0, (s.intake || SIMC.base + 1) - SIMC.base), f = k => Math.pow(1 + G[k], n);
  const L0 = SIMC.living[s.living] || SIMC.living.shared;
  /* Living costs: your own amounts (rentC, foodC, otherC, healthC) replace the housing defaults when set */
  const lv = {rent:val(s.rentC, L0.rent) * f('rent'), food:val(s.foodC, L0.food) * f('cpi'), other:val(s.otherC, L0.other) * f('cpi'), health:val(s.healthC, SIMC.health) * f('health')};
  const exp = lv.rent + lv.food + lv.other + lv.health, wage = s.wage * f('wage');
  const tuY = s.tuition * f('tuition'), fees = val(s.fees, ty.fees) * f('tuition');
  const tu1 = tuY + fees;
  const tu2 = s.type === 'private' ? tu1 : tu1 * (1 + G.tuition);
  const pY = proofYears(s.intake), proofF = Math.pow(1 + G.proof, pY);
  const proof = val(s.proof, fundsAmt()) * proofF;
  const travel = val(s.travel, SIMC.travel) * f('cpi'), setup = val(s.setup, SIMC.setup);
  const cw = val(s.coopWage, ty.coopWage) * f('wage'), ftH = val(s.coopHours, ty.coopH);
  const net = g => g * takeHome(g);
  const side = val(s.side, 0);
  /* tips: average per hour in part-time service jobs (study months, extra job, breaks, after graduation); taxable like pay */
  const tips = val(s.tips, 0) * f('wage'), pt = wage + tips;
  const gS = s.hours * pt * SIMC.weeks, gC = (ftH * cw + side * pt) * SIMC.weeks, gB = ftH * pt * SIMC.weeks, gG = s.pgwp === false ? 0 : gB;
  const netC20 = net((20 * cw + side * pt) * SIMC.weeks);
  const incS = net(gS), incC = net(gC), incB = net(gB), incG = net(gG);
  const plan = planOf(s), N = plan.length;
  const months = []; let bal = proof, low = {v:bal, m:0}, runOut = 0;
  plan.forEach((ph, i) => {
    const m = i + 1; let paid = 0;
    if (m === 13) { paid = tu2; bal -= tu2; }
    let inc = ph === 'S' ? incS : ph === 'C' ? incC : ph === 'B' ? incB : incG;
    if (m === 1 && ph === 'S') inc *= 0.5;          /* first month: getting a SIN and finding a job */
    bal += inc - exp; months.push({m, bal, inc, ph, paid});
    if (bal < low.v) low = {v:bal, m};
    if (bal < 0 && !runOut) runOut = m;
  });
  const cnt = k => plan.filter(p => p === k).length;
  const show = tu1 + proof + travel;
  return {s, ty, n, lv, exp, wage, tips, cw, ftH, side, netC20:netC20 - (lv.rent + lv.food + lv.other + lv.health), tuY, fees, tu1, tu2, proof, pY, travel, setup, incS, incC, incB, incG, plan, N, years:N / 12, months,
    gS, gC, gB, gG, fac:{tuition:f('tuition'), rent:f('rent'), cpi:f('cpi'), health:f('health'), wage:f('wage'), proof:proofF},
    end:bal, low, runOut, runOutY1: runOut && runOut <= 12 ? runOut : 0, extra:Math.max(0, -low.v),
    mS:cnt('S'), mC:cnt('C'), mB:cnt('B'), mG:cnt('G'), netS:incS - exp, netC:incC - exp, netB:incB - exp, netG:incG - exp,
    show, total:show + setup,
    breakEvenHrs:exp / (pt * SIMC.weeks * 0.93), cover:Math.round(incS / exp * 100),
    tuTotal:tu1 + (N > 12 ? tu2 : 0)};
}

const niceMax = v => { const p = Math.pow(10, Math.floor(Math.log10(Math.max(v,1)))); return Math.ceil(v / p) * p; };
const niceMin = v => v >= 0 ? 0 : -niceMax(-v);

function analysis(c){
  const M = SIM_UI, s = c.s, r = S.sim.rate;
  const C = v => `<strong class="num">CAD ${fmt(Math.abs(v))}</strong> <span class="muted num">(${thb(Math.abs(v)*r)})</span>`;
  const level = c.runOutY1 ? 'crit' : (c.extra > 0 ? 'need' : (c.end < c.proof ? 'warn' : 'good'));
  const V = M.verdict[level];
  const pts = [];
  pts.push(T(M.a1)(C(c.show), C(c.tu1), C(c.proof), C(c.travel)));
  pts.push(T(M.aWhy));
  pts.push(c.netS >= 0 ? T(M.a2ok)(c.mS, c.cover, C(c.netS)) : T(M.a2short)(c.mS, c.cover, C(c.netS)));
  pts.push(c.breakEvenHrs <= 24 ? T(M.a3ok)(Math.ceil(c.breakEvenHrs), s.hours) : T(M.a3no)(Math.ceil(c.breakEvenHrs)));
  if (c.mC) pts.push(c.netC >= 0 ? T(M.a4ok)(c.mC, C(c.netC), c.cw.toFixed(2), c.ftH) : T(M.a4short)(c.mC, C(c.netC), c.cw.toFixed(2), c.ftH));
  if (c.mC && c.side > 0) pts.push(T(M.aSide)(c.side));
  if (c.mC && s.type === 'private' && c.ftH > 20) pts.push(T(M.a4alt)(c.ftH, (c.netC20 < 0 ? '-' : '+') + 'CAD ' + fmt(Math.abs(c.netC20))));
  if (c.mB) pts.push(c.netB >= 0 ? T(M.a8ok)(c.mB, C(c.netB), c.ftH) : T(M.a8short)(c.mB, C(c.netB), c.ftH));
  if (c.mG) pts.push(s.pgwp === false ? T(M.a9off)(c.mG, C(c.netG)) : (c.netG >= 0 ? T(M.a9ok)(c.mG, C(c.netG), c.ftH) : T(M.a8short)(c.mG, C(c.netG), c.ftH)));
  if (c.N > 12) pts.push(T(M.a6)(C(c.tu2), c.extra > 0 ? C(c.extra) : ''));
  pts.push(c.runOut ? T(M.a5out)(c.runOut, C(c.extra)) : (c.low.m === 0 ? T(M.a5up)(c.N, C(c.proof), C(c.end)) : T(M.a5)(c.N, C(c.proof), C(c.end), c.low.m, C(c.low.v))));
  if (c.n > 0) pts.push(T(M.a7)(s.intake, c.n));
  return `
  <div class="card verdict v-${level}">
    <div class="flex items-center gap-2"><span class="vicon">${ic(V.icon)}</span><div><div class="eyebrow">${T(M.vT)}</div><div class="text-[19px] font-semibold">${T(V.l)}</div></div></div>
    <p class="text-[15px] mt-2">${T(V.d)}</p>
    <ol class="analysis mt-3">${pts.map(p => `<li>${p}</li>`).join('')}</ol>
  </div>`;
}

function parseFunds(html){
  if (!html) return null;

  else if (act === 'cal-close') { S.calSel = ''; render(true); }
  else if (act === 'cal-done') { S.check[v] = !S.check[v]; render(true); }
  else if (act === 'cal-go') { const el = document.getElementById('ck-' + v); if (el) { el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'center'}); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); } }
  else if (act === 'plan-ics') { downloadIcs(); }
  else if (act === 'focus') { const el = document.getElementById(v); if (el) { el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'center'}); el.focus({preventScroll:true}); } }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.sim; if (!k) return;
  const v = parseFloat(e.target.value);
  if (!isFinite(v) || v < 0 || (v === 0 && !['hours','coopWage','fees','side','tips'].includes(k))) return;
  S.sim[k] = v; if (k === 'rate') S.sim.rateAuto = false; if (k === 'proof') S.sim.proofAuto = false;
  saveSoon(); queueSim();
});
document.addEventListener('input', e => {
  const k = e.target.dataset.conv; if (!k) return;
  const v = parseFloat(e.target.value) || 0, r = S.sim.rate || 24;
  if (k === 'cad') document.getElementById('conv-thb').value = Math.round(v * r);
  else document.getElementById('conv-cad').value = Math.round(v / r * 100) / 100;
});
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.dataset || !d.dataset.field) return;
  S.open = S.open || {}; S.open[d.dataset.field] = d.open; save();
}, true);
document.addEventListener('change', e => {
  if (e.target.dataset.step) { S.steps[e.target.dataset.step] = e.target.checked; render(true); return; }
  const id = e.target.dataset.check; if (!id) return;
  S.check[id] = e.target.checked; render(true);
});

applyFunds();
render(false);
loadFx();
loadLive();
</script>
</body>
</html>
