<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Canada Work &amp; Study to PR Guide 2027 to 2028</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  /* ============ AppKit (macOS) with Liquid Glass materials ============ */
  :root{
    color-scheme:light;
    --window:#EEF1F6; --toolbar:rgba(255,255,255,.62);
    --card:rgba(255,255,255,.6); --bg:rgba(0,0,0,.045);
    --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.86); --glass-border:rgba(255,255,255,.75);
    --glass-shadow:0 10px 30px rgba(30,40,70,.12),0 1px 3px rgba(30,40,70,.08);
    --specular:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.25);
    --wall:radial-gradient(60vw 55vh at 10% 6%,rgba(110,165,255,.42),transparent 62%),
           radial-gradient(48vw 50vh at 92% 14%,rgba(255,140,165,.28),transparent 60%),
           radial-gradient(60vw 60vh at 72% 96%,rgba(95,215,205,.32),transparent 62%),
           radial-gradient(45vw 45vh at 22% 88%,rgba(175,150,255,.24),transparent 60%);
    --line:rgba(0,0,0,.09); --line2:rgba(0,0,0,.15);
    --ink:rgba(0,0,0,.88); --ink2:rgba(0,0,0,.66); --ink3:rgba(0,0,0,.6);
    --ctl:#FFFFFF; --field:#FFFFFF; --knob:#FFFFFF; --seg-on:#FFFFFF;
    --ctl-border:rgba(0,0,0,.22); --track:rgba(120,120,128,.26); --sel:rgba(0,0,0,.09); --hover:rgba(0,0,0,.045);
    --accent:#0070E0; --blue:#0064D9; --blue-soft:rgba(0,122,255,.12);
    --green:#1D7A33; --green-soft:rgba(52,199,89,.18);
    --amber:#9A4D00; --amber-soft:rgba(255,149,0,.16);
    --red:#C4281C; --red-soft:rgba(255,59,48,.12);
    --gray-soft:rgba(120,120,128,.14); --ring:rgba(0,122,255,.5);
    --shadow-ctl:0 .5px 1px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.16);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --window:#0C0E13; --toolbar:rgba(44,47,58,.58);
    --card:rgba(255,255,255,.075); --bg:rgba(255,255,255,.07);
    --glass:rgba(52,56,68,.5); --glass-strong:rgba(120,126,142,.5); --glass-border:rgba(255,255,255,.16);
    --glass-shadow:0 12px 34px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
    --specular:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.05);
    --wall:radial-gradient(60vw 55vh at 10% 6%,rgba(40,95,220,.42),transparent 62%),
           radial-gradient(48vw 50vh at 92% 14%,rgba(190,50,95,.28),transparent 60%),
           radial-gradient(60vw 60vh at 72% 96%,rgba(20,140,135,.32),transparent 62%),
           radial-gradient(45vw 45vh at 22% 88%,rgba(100,70,200,.28),transparent 60%);
    --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.17);
    --ink:rgba(255,255,255,.9); --ink2:rgba(255,255,255,.68); --ink3:rgba(255,255,255,.6);
    --ctl:#565659; --field:rgba(255,255,255,.07); --knob:#D4D4D6; --seg-on:#6A6A6E;
    --ctl-border:rgba(255,255,255,.24); --track:rgba(255,255,255,.2); --sel:rgba(255,255,255,.13); --hover:rgba(255,255,255,.06);
    --accent:#0070E0; --blue:#5AAEFF; --blue-soft:rgba(10,132,255,.24);
    --green:#32D74B; --green-soft:rgba(48,209,88,.2);
    --amber:#FFA826; --amber-soft:rgba(255,159,10,.2);
    --red:#FF6F66; --red-soft:rgba(255,69,58,.2);
    --gray-soft:rgba(255,255,255,.1); --ring:rgba(10,132,255,.6);
    --shadow-ctl:0 .5px 1px rgba(0,0,0,.45),inset 0 .5px 0 rgba(255,255,255,.16);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scrollbar-color:rgba(128,128,128,.5) transparent}
  body{margin:0;background:var(--window);color:var(--ink);font-size:15px;line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Sukhumvit Set","Noto Sans Thai",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  html[lang="th"] body{font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Noto Sans Thai","Inter",sans-serif}
  h1,h2,h3,h4{margin:0;letter-spacing:-0.012em;line-height:1.3;text-wrap:balance}
  html[lang="th"] h1,html[lang="th"] h2,html[lang="th"] h3,html[lang="th"] h4{letter-spacing:0;line-height:1.45}
  p{margin:0}
  a{color:var(--blue);text-underline-offset:3px}
  /* the wallpaper the glass refracts; fixed so content slides over it */
  body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--wall),var(--window)}
  ::selection{background:rgba(0,122,255,.28)}
  input{caret-color:var(--accent);accent-color:var(--accent)}

  /* ---------- window: sidebar + toolbar + content ---------- */
  .app{display:flex;min-height:100vh}
  .sidebar{display:none}
  .content{flex:1;min-width:0}
  .toolbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
    height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0}
  /* scroll edge effect: content blurs and fades as it passes under the floating toolbar items */
  .toolbar::before{content:"";position:absolute;inset:0 0 -14px 0;z-index:-1;pointer-events:none;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
  .toolbar .seg button{min-height:28px}
  .tb-title{font-size:15px;font-weight:700;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 16px}
  #app h1{font-size:26px;font-weight:700}
  #app h1 + p{font-size:15px;margin-top:8px}
  @media (min-width:1024px){
    .toolbar{padding-left:28px;padding-right:28px}
    .wrap{padding:28px 28px}
  }
  .tb-sec{color:var(--ink2);font-weight:600;margin-left:12px}
  .tb-btn{width:34px;height:34px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;padding:0}
  .appicon{width:28px;height:28px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;
    background:linear-gradient(#3F9BFF,#0068D6);box-shadow:0 1px 2px rgba(0,0,0,.25),inset 0 .5px 0 rgba(255,255,255,.35)}
  .sb-head{font-size:11.5px;font-weight:600;color:var(--ink3);padding:4px 8px 4px}
  .sb-row{width:100%;display:flex;align-items:center;gap:8px;min-height:36px;padding:4px 10px;border:0;background:none;border-radius:12px;
    font:inherit;font-size:14px;line-height:1.35;color:var(--ink);cursor:pointer;text-align:left}
  .sb-row svg{width:16px;height:16px;color:var(--blue);flex:none}
  .sb-row .cnt{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .sb-row.on{background:var(--glass-strong);font-weight:600;box-shadow:0 2px 8px rgba(30,40,70,.12),var(--specular)}
  @media (hover:hover){.sb-row:not(.on):hover{background:var(--hover)}}

  /* ---------- NSBox style groups ---------- */
  .card{background:var(--card);border:1px solid var(--glass-border);border-radius:20px;padding:20px;box-shadow:0 6px 22px rgba(30,40,70,.07),var(--specular)}
  .card-warn{background:var(--amber-soft);border-color:transparent}
  .grp{font-size:15px;font-weight:700;margin:0 0 8px 2px}
  .muted{color:var(--ink2)} .faint{color:var(--ink3)}
  .eyebrow{font-size:12.5px;font-weight:500;color:var(--ink3)}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;line-height:1.5}
  .b-green{background:var(--green-soft);color:var(--green)}
  .b-amber{background:var(--amber-soft);color:var(--amber)}
  .b-red{background:var(--red-soft);color:var(--red)}
  .b-blue{background:var(--blue-soft);color:var(--blue)}
  .b-gray{background:var(--gray-soft);color:var(--ink2)}
  .icon{width:18px;height:18px;flex:none} .icon-sm{width:14px;height:14px;flex:none}
  .tile{width:36px;height:36px;border-radius:11px;box-shadow:var(--specular);display:flex;align-items:center;justify-content:center;flex:none}
  ul.clean{list-style:none;margin:0;padding:0}
  ul.clean li{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:15px}
  ul.clean li svg{margin-top:5px}
  .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
  .row:first-child{border-top:0}
  .big{font-size:28px;font-weight:700;letter-spacing:-0.015em;line-height:1.2}
  .num{font-variant-numeric:tabular-nums}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px}
  .stat-sub{display:block;font-size:13px;font-weight:400;color:var(--ink2);margin-top:2px}

  /* ---------- NSButton ---------- */
  .btn{border:1px solid var(--glass-border);border-radius:999px;min-height:32px;padding:4px 16px;font:inherit;font-size:14px;font-weight:500;line-height:1.4;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--glass-strong);color:var(--ink);
    box-shadow:0 3px 10px rgba(30,40,70,.12),var(--specular);transition:transform .18s cubic-bezier(.2,.8,.2,1)}
  .btn-primary{border-color:rgba(255,255,255,.28);background:var(--accent) linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0) 55%);color:#fff;
    box-shadow:0 5px 14px rgba(0,90,200,.32),inset 0 1px 0 rgba(255,255,255,.5)}
  .btn:active{transform:scale(.97)}
  .btn-ghost{color:var(--ink)}
  .btn:active{filter:brightness(.93)}

  /* ---------- NSSegmentedControl ---------- */
  .seg{display:inline-flex;flex-wrap:wrap;background:var(--gray-soft);border-radius:18px;padding:3px;gap:2px;box-shadow:inset 0 0 0 .5px var(--line)}
  .seg button{border:0;background:transparent;min-height:28px;padding:3px 14px;border-radius:999px;font:inherit;font-size:13.5px;font-weight:500;color:var(--ink);cursor:pointer}
  .seg button.on{background:var(--glass-strong);box-shadow:0 2px 6px rgba(30,40,70,.16),var(--specular)}
  @media (hover:hover){.seg button:not(.on):hover{background:var(--hover)}}

  /* ---------- radio buttons (quiz) ---------- */
  .opt{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:transparent;border-radius:12px;
    padding:7px 10px;font:inherit;font-size:15px;line-height:1.5;color:var(--ink);cursor:pointer}
  .opt::before{content:"";flex:none;width:16px;height:16px;margin-top:3px;border-radius:50%;background:var(--ctl);
    box-shadow:inset 0 0 0 1px var(--ctl-border),inset 0 1px 1.5px rgba(0,0,0,.08)}
  .opt.on::before{background:radial-gradient(circle,#fff 0 2.8px,var(--accent) 3.4px);box-shadow:inset 0 0 0 .5px rgba(0,60,140,.5)}
  @media (hover:hover){.opt:hover{background:var(--hover)}}
  .opt:active{background:var(--sel)}

  /* ---------- checkbox ---------- */
  .check{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
  .check:first-child{border-top:0}
  .check input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border-radius:4px;flex:none;margin:4px 0 0;cursor:pointer;position:relative;
    background:var(--ctl);box-shadow:inset 0 0 0 1px var(--ctl-border),inset 0 1px 1.5px rgba(0,0,0,.08)}
  .check input:checked{background:var(--accent) linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,0));box-shadow:inset 0 0 0 .5px rgba(0,60,140,.5)}
  .check input:checked::after{content:"";position:absolute;left:5.5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .check.done .ct{color:var(--ink3);text-decoration:line-through}

  /* ---------- progress, slider, text field ---------- */
  .bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;outline-offset:6px;margin:12px 0;touch-action:pan-y;
    background:linear-gradient(to right,var(--accent) var(--p,50%),var(--track) var(--p,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--knob);cursor:pointer;
    box-shadow:0 .5px 2px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.2)}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--knob);cursor:pointer;
    box-shadow:0 .5px 2px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.2)}
  .numin{border:0;border-radius:10px;min-height:30px;padding:2px 8px;width:96px;font:inherit;font-size:14px;text-align:right;color:var(--ink);
    background:var(--field);box-shadow:inset 0 0 0 1px var(--ctl-border),inset 0 1px 1.5px rgba(0,0,0,.06)}
  button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ring);outline-offset:1px}
  .numin:focus-visible{outline-offset:0}

  /* ---------- NSTableView (costs) ---------- */
  .tbl{padding:0;overflow:hidden}
  .thead{display:none}
  .trow{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;align-items:baseline;padding:10px 14px}
  .trow > :first-child{grid-column:1 / -1}
  .trow:nth-child(odd){background:var(--hover)}
  .trow .amt{font-variant-numeric:tabular-nums}
  .trow .amt + .amt{text-align:right;font-weight:600}
  .trow.total{border-top:1px solid var(--line2);font-weight:700;background:none}
  @media (min-width:640px){
    .thead,.trow{grid-template-columns:minmax(0,1fr) 150px 190px}
    .thead{display:grid;gap:16px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--ink3);border-bottom:1px solid var(--line)}
    .thead > :not(:first-child),.trow .amt{text-align:right}
    .trow > :first-child{grid-column:auto}
    .trow .cur{display:none}
  }

  /* ---------- timeline ---------- */
  .tl{position:relative;padding-left:40px}
  .tl::before{content:"";position:absolute;left:12px;top:8px;bottom:8px;width:2px;background:var(--track)}
  .tl-step{position:relative;padding-bottom:16px}
  .tl-step:last-child{padding-bottom:0}
  .tl-dot{position:absolute;left:-40px;top:0;width:26px;height:26px;border-radius:50%;background:var(--glass-strong);box-shadow:inset 0 0 0 1.5px var(--blue),0 2px 6px rgba(30,40,70,.12);color:var(--blue);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  .tl-dot.goal{background:var(--green);box-shadow:none;color:#fff}
  :root[data-theme="dark"] .tl-dot.goal{color:#0C0E13}
  .tl-dot.risk{box-shadow:inset 0 0 0 1.5px var(--amber);color:var(--amber)}

  .fade{animation:fade .25s cubic-bezier(.2,.8,.2,1)}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}.bar>i{transition:none}html{scroll-behavior:auto}}

  /* ---------- phone and tablet: bottom tab bar ---------- */
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));
    background:var(--toolbar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:1px solid var(--line2);padding:4px max(4px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left))}
  .bnav button{border:0;background:none;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-height:50px;min-width:0;font-size:11px;font-weight:500;line-height:1.2;color:var(--ink2);cursor:pointer;border-radius:8px;padding:4px 0}
  .bnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bnav button.on{color:var(--blue);font-weight:600}
  .bnav button:active{background:var(--hover)}
  .bnav svg{width:22px;height:22px}
  .sim-mini{position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:20;display:flex;justify-content:space-between;gap:12px;
    background:var(--toolbar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border:1px solid var(--line2);border-radius:10px;padding:8px 14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.12)}
  .sim-mini b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
  .sim-mini small{display:block;font-size:12px;color:var(--ink2)}
  #fx-chip{border:0;cursor:pointer;font-family:inherit;white-space:nowrap}
  @media (min-width:1024px){.sim-mini{display:none}}
  body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
  @media (max-width:1023px){.tb-full{display:none}}
  @media (min-width:1024px){.tb-short{display:none}}
  @media (max-width:767px){
    .tl{padding-left:36px}
    .tl-dot{left:-36px}
    ul.clean li,.row,.opt{font-size:16px}
  }
  /* ---------- touch: 44px targets, no zoom-on-focus ---------- */
  @media (max-width:1023px),(pointer:coarse){
    .seg button{min-height:40px;padding:6px 14px;font-size:14.5px}
    .toolbar .seg button{min-height:36px}
    .btn{min-height:44px;padding:8px 20px;font-size:15px}
    .opt{min-height:44px;padding:10px 8px}
    .opt::before{width:20px;height:20px;margin-top:2px}
    .opt.on::before{background:radial-gradient(circle,#fff 0 3.6px,var(--accent) 4.2px)}
    .check input{width:22px;height:22px;border-radius:6px;margin-top:1px}
    .check input:checked::after{left:8px;top:3.5px;width:5px;height:10px}
    .numin{min-height:44px;font-size:16px;border-radius:14px}
    .tap{min-height:44px;display:inline-flex;align-items:center}
    #fx-chip{min-height:36px;padding:3px 10px}
    input[type=range]{height:44px;margin:0;padding:20px 0;background-clip:content-box}
    input[type=range]::-webkit-slider-thumb{width:28px;height:28px}
    input[type=range]::-moz-range-thumb{width:28px;height:28px}
  }

  /* ---------- Liquid Glass: floating chrome that blurs and saturates what is behind it ---------- */
  .tb-btn,.bnav,.sim-mini,#fx-chip,.toolbar .seg{
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(26px) saturate(190%);-webkit-backdrop-filter:blur(26px) saturate(190%);
    box-shadow:var(--glass-shadow),var(--specular)}
  .bnav{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));border-radius:30px;padding:5px}
  .bnav button{border-radius:24px}
  .bnav button.on{background:var(--glass-strong);box-shadow:0 2px 8px rgba(30,40,70,.12),var(--specular)}
  @media (hover:hover){.bnav button:not(.on):hover{background:var(--hover)}}
  /* computer: the tab bar becomes a centred dock */
  @media (min-width:1024px){
    .bnav{left:50%;right:auto;transform:translateX(-50%);width:min(800px,calc(100% - 48px));bottom:16px}
    .bnav button{flex-direction:row;gap:8px;min-height:46px;font-size:13.5px}
    .bnav svg{width:18px;height:18px}
  }
  .sim-mini{border-radius:20px;padding:10px 18px}
  #fx-chip{min-height:34px;padding:4px 14px;color:var(--ink);font-size:12.5px}
  .toolbar .seg{border-radius:999px}
  .tb-title{font-size:17px;text-shadow:0 0 12px var(--window)}
  @media (prefers-reduced-transparency:reduce){
    .tb-btn,.bnav,.sim-mini,#fx-chip,.toolbar .seg{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--glass-strong)}
    .toolbar::before{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--window)}
  }
</style>
</head>
<body>

<div class="app">
  <div class="content">
    <header class="toolbar">
      <span class="appicon"><i data-lucide="book-open" class="icon-sm"></i></span>

  return unit === 'thb'

    : {cad:rangeStr(a,b), thb:rangeStr(rnd(a*r,100), rnd(b*r,100))};
}
function stack(a, b){
  const m = money(a, b, 'cad');
  return `CAD ${m.cad}<span class="stat-sub num">${S.lang === 'th' ? `ประมาณ ${m.thb} บาท` : `about THB ${m.thb}`}</span>`;

}

const tabL = id => UI.tabs.find(t => t.id === id).l;

function viewStart(){
  const A = START, done = A.steps.filter(s => S.steps[s.id]).length, pct = Math.round(done/A.steps.length*100);
  const steps = A.steps.map((s,i) => `
    <div class="tl-step">
      <div class="tl-dot ${S.steps[s.id]?'goal':''}">${S.steps[s.id]?ic('check','icon-sm'):i+1}</div>
      <div class="card">
        <span class="badge b-blue">${ic('clock','icon-sm')}${T(s.m)}${i<9?' '+T(A.before):''}</span>
        <h2 class="text-[18px] font-semibold mt-3 flex items-start gap-2"><span style="color:var(--blue);margin-top:4px">${ic(s.icon)}</span><span>${T(s.t)}</span></h2>
        <ul class="clean mt-2">${s.d.map(x => `<li><span style="color:var(--ink3)">${ic('chevron-right','icon-sm')}</span><span>${T(x)}</span></li>`).join('')}</ul>
        <div class="mt-3 text-[14.5px] flex gap-2" style="background:var(--bg);border-radius:8px;padding:8px 12px"><span style="color:var(--green)">${ic('banknote','icon-sm')}</span><span><strong>${T(A.cost)}:</strong> <span class="num">${T(s.c)}</span></span></div>
        <div class="flex flex-wrap gap-2 mt-3">
          ${s.go?`<button class="btn btn-primary" style="padding:7px 16px;font-size:14px" data-act="tab" data-v="${s.go.tab}">${T(s.go.l)}${ic('arrow-right','icon-sm')}</button>`:''}
          ${s.link?`<a class="btn btn-ghost" style="font-size:14px" href="${s.link}" target="_blank" rel="noopener noreferrer">${ic('external-link','icon-sm')}${T({en:'Official page', th:'หน้าเว็บทางการ'})}</a>`:''}
        </div>
        <label class="check tap text-[15px] font-medium mt-3" style="display:flex;align-items:center;padding:10px 0 0;border-top:1px solid var(--line);width:100%"><input type="checkbox" style="margin:0" data-step="${s.id}" ${S.steps[s.id]?'checked':''}>${T(A.done)}</label>
      </div>
    </div>`).join('');
  return `
    <section class="mb-8" style="max-width:820px">
      <h1 class="text-[28px] sm:text-[42px] font-bold">${T(A.h1)}</h1>
      <p class="muted text-[17px] mt-4" style="max-width:62ch">${T(A.lead)}</p>
    </section>
    <div class="grid lg:grid-cols-3 gap-6 items-start">
      <div class="lg:col-span-2">
        <div class="card mb-6">
          <div class="flex justify-between text-[14px] mb-2"><span class="muted">${T(A.progress)}</span><span class="num font-semibold">${done} / ${A.steps.length}</span></div>
          <div class="bar"><i style="width:${pct}%;background:var(--green)"></i></div>
        </div>
        <div class="tl">${steps}</div>
      </div>
      <div class="card lg:sticky" style="top:72px">
        <h2 class="text-[18px] font-semibold mb-1">${T(A.glossT)}</h2>
        ${A.gloss.map(g => `<div class="py-2" style="border-top:1px solid var(--line)"><div class="font-semibold text-[14.5px]">${g.k}</div><div class="muted text-[14px]">${T(g.v)}</div></div>`).join('')}
      </div>
    </div>`;
}

function costRange(it){ const r = S.sim.rate || 24; return it.cad ? it.cad : [it.thb[0]/r, it.thb[1]/r]; }
function viewCosts(){
  const C = COSTS, r = S.sim.rate || 24;
  let tMin = 0, tMax = 0;
  const secs = C.secs.map(sec => {
    let a = 0, b = 0;
    const rows = sec.items.map(it => {
      const m = it.cad ? money(it.cad[0], it.cad[1], 'cad') : money(it.thb[0], it.thb[1], 'thb');
      const cr = costRange(it); a += cr[0]; b += cr[1];
      return `
        <div class="trow">
          <div>
            <div class="font-medium text-[15px]">${T(it.t)}</div>
            <div class="flex flex-wrap items-center gap-2 mt-1">
              <span class="badge ${it.off?'b-green':'b-gray'}">${T(it.off?C.off:C.est)}</span>
              ${it.n?`<span class="faint text-[13px]">${T(it.n)}</span>`:''}
              ${it.u?`<a href="${it.u}" target="_blank" rel="noopener noreferrer" class="tap text-[14px] inline-flex items-center gap-1 hover:underline" style="color:var(--blue)">${ic('external-link','icon-sm')}${T(C.verify)}</a>`:''}
            </div>
          </div>
          <div class="amt"><span class="cur faint text-[12px]">CAD </span>${m.cad}</div>
          <div class="amt"><span class="cur faint text-[12px] font-normal">THB </span>${m.thb}</div>
        </div>`;
    }).join('');
    if (sec.sum) { tMin += a; tMax += b; }
    const sm = money(rnd(a,5), rnd(b,5), 'cad');
    return `
      <section>
        <h2 class="grp">${T(sec.t)}</h2>
        <div class="card tbl">
          <div class="thead"><div>${T(C.item)}</div><div>CAD</div><div>THB</div></div>
          ${rows}
          <div class="trow total">
            <div>${T(C.sub)}</div>
            <div class="amt"><span class="cur faint text-[12px] font-normal">CAD </span>${sm.cad}</div>
            <div class="amt"><span class="cur faint text-[12px] font-normal">THB </span>${sm.thb}</div>
          </div>
        </div>
      </section>`;
  }).join('');
  const tot = money(rnd(tMin,10), rnd(tMax,10), 'cad'), show = S.sim.tuition + S.sim.proof;
  return `
    <section class="mb-6" style="max-width:820px">
      <h1 class="text-[30px] sm:text-[38px] font-bold">${T(C.h1)}</h1>
      <p class="muted mt-3 text-[17px]">${T(C.lead)}</p>
    </section>
    <div class="grid lg:grid-cols-3 gap-4 mb-4">
      <div class="card">
        <div class="eyebrow mb-2">${T(C.conv)}</div>
        <div class="flex items-center gap-2 mb-2"><span class="faint text-[13px] w-10">CAD</span><input class="numin num" style="width:100%" type="number" min="0" inputmode="decimal" aria-label="CAD" id="conv-cad" data-conv="cad" value="1000"></div>
        <div class="flex items-center gap-2"><span class="faint text-[13px] w-10">THB</span><input class="numin num" style="width:100%" type="number" min="0" inputmode="decimal" aria-label="THB" id="conv-thb" data-conv="thb" value="${Math.round(1000*r)}"></div>
        <div class="faint text-[13px] mt-3" id="fx-status"></div>
      </div>
      <div class="card">
        <div class="eyebrow">${T(C.totalT)}</div>
        <div class="text-[24px] font-bold num mt-1">THB ${tot.thb}</div>
        <div class="muted num">CAD ${tot.cad}</div>
        <p class="faint text-[13px] mt-2">${T(C.totalN)}</p>
      </div>
      <div class="card">
        <div class="eyebrow">${T(C.showT)}</div>
        <div class="text-[24px] font-bold num mt-1">${thb(show*r)}</div>
        <div class="muted num">${cad(show)}</div>
        <p class="faint text-[13px] mt-2">${T(C.showN)}</p>
        <button class="btn btn-ghost mt-1" style="padding:4px 8px;font-size:14px" data-act="tab" data-v="prep">${T(C.open)}${ic('arrow-right','icon-sm')}</button>
      </div>
    </div>
    <div class="grid gap-6 mt-6">${secs}</div>
    <p class="faint text-[13px] mt-4 flex gap-2" style="max-width:90ch">${ic('info','icon-sm')}<span>${T(C.note)}</span></p>`;
}

function quizScore(){
  let a=0,b=0,maxA=0,maxB=0,city=null,n=0;
  QUIZ.forEach(q => {
    maxA += Math.max(...q.o.map(o=>o.a)); maxB += Math.max(...q.o.map(o=>o.b));
    const i = S.quiz[q.id];
    if (i != null && q.o[i]) { n++; a += q.o[i].a; b += q.o[i].b; if (q.o[i].city) city = q.o[i].city; }
  });
  return {a,b,maxA,maxB,city,n,done:n===QUIZ.length};
}
function viewQuiz(){
  const Q = QUIZ_UI, r = quizScore();
  const qs = QUIZ.map((q,qi) => `
    <div class="card">
      <div class="flex items-center gap-2 mb-2"><span class="badge b-gray">${ic(q.icon,'icon-sm')}${T(q.cat)}</span><span class="faint text-[13px] num">${qi+1} / ${QUIZ.length}</span></div>
      <h3 class="text-[17px] font-semibold mb-3">${T(q.q)}</h3>
      <div class="grid gap-2">${q.o.map((o,oi) => `<button class="opt ${S.quiz[q.id]===oi?'on':''}" data-act="quiz" data-q="${q.id}" data-o="${oi}" aria-pressed="${S.quiz[q.id]===oi}">${T(o.l)}</button>`).join('')}</div>
    </div>`).join('');
  let res;
  if (!r.done) {
    res = `<p class="muted">${T(Q.pending)}</p>`;
  } else {
    const pa = Math.round(r.a/r.maxA*100), pb = Math.round(r.b/r.maxB*100);
    const rec = Math.abs(r.a - r.b) <= 2 ? Q.recMix : (r.a > r.b ? Q.recA : Q.recB);
    const sc = rec === Q.recA ? 'safe' : 'one';
    res = `
      <h3 class="text-[22px] font-semibold">${T(rec.t)}</h3>
      <p class="muted mt-2 text-[15px]">${T(rec.d)}</p>
      <div class="mt-5 grid gap-3">
        <div><div class="flex justify-between text-[14px] mb-1"><span>${T(Q.fitA)}</span><span class="num font-semibold">${pa}%</span></div><div class="bar"><i style="width:${pa}%;background:var(--amber)"></i></div></div>
        <div><div class="flex justify-between text-[14px] mb-1"><span>${T(Q.fitB)}</span><span class="num font-semibold">${pb}%</span></div><div class="bar"><i style="width:${pb}%;background:var(--green)"></i></div></div>
      </div>
      ${r.city ? `<p class="mt-5 text-[14.5px] flex gap-2"><span style="color:var(--blue)">${ic('map-pin','icon-sm')}</span><span>${T(Q.city[r.city])}</span></p>` : ''}
      <button class="btn btn-primary mt-5" data-act="goroad" data-v="${sc}">${T(Q.go)}${ic('arrow-right','icon-sm')}</button>`;
  }
  return `
    <div class="flex flex-wrap items-end justify-between gap-3 mb-5">
      <div><h2 class="text-[26px] font-semibold">${T(Q.title)}</h2><p class="muted mt-1">${T(Q.sub)}</p></div>

    </div>

      <div class="lg:col-span-2 grid gap-4">${qs}</div>
      <div class="card lg:sticky" style="top:72px">
        <div class="flex justify-between text-[14px] mb-2"><span class="muted">${T(Q.progress)}</span><span class="num font-semibold">${r.n} / ${QUIZ.length}</span></div>
        <div class="bar mb-5"><i style="width:${r.n/QUIZ.length*100}%"></i></div>
        ${res}
      </div>
    </div>`;
}

function simCalc(){
  const s = S.sim, ty = SIMC.types[s.type], lv = SIMC.living[s.living];
  const exp = lv.rent + lv.food + lv.other;
  const studyInc = s.hours * s.wage * SIMC.weeks * SIMC.studyTax;
  const coopInc = s.coopHours * s.wage * SIMC.weeks * SIMC.coopTax;
  const show = s.tuition + s.proof;
  return {ty, lv, exp, studyInc, coopInc, studyNet:studyInc-exp, coopNet:coopInc-exp, show,
    total:show + SIMC.setup, year:(studyInc-exp)*ty.study + (coopInc-exp)*ty.coop};
}
/* ---------- live CAD to THB rate, refreshed once per day ---------- */
let fxState = 'idle';
const today = () => new Date().toLocaleDateString('en-CA');
function fxStatusHtml(){
  const f = S.fx;
  if (!f.rate) return fxState === 'fail' ? T(FX_UI.fail) : T(FX_UI.loading);
  const d = new Date(f.date).toLocaleDateString(S.lang==='th'?'th-TH':'en-GB', {day:'numeric', month:'short', year:'numeric'});
  const stale = fxState === 'fail' ? ' ' + T(FX_UI.fail) : '';
  if (S.sim.rateAuto) return `<span class="dot" aria-hidden="true"></span>${T(FX_UI.live)} ${d} (${f.src}). ${T(FX_UI.auto)}${stale}`;
  return `${T(FX_UI.manual)} <span class="num">${f.rate.toFixed(2)}</span> (${d}). <button class="btn btn-ghost" style="padding:2px 8px;font-size:13px" data-act="fxlive">${T(FX_UI.use)}</button>`;
}
function applyFx(){
  if (S.sim.rateAuto && S.fx.rate) S.sim.rate = +S.fx.rate.toFixed(2);
  render(true);
}
async function loadFx(){
  if (S.fx.rate && S.fx.day === today()) { applyFx(); return; }
  fxState = 'loading';
  const sources = [
    {n:'open.er-api.com', u:'https://open.er-api.com/v6/latest/CAD', p:j => ({rate:j.rates.THB, date:j.time_last_update_utc})},
    {n:'frankfurter.dev', u:'https://api.frankfurter.dev/v1/latest?base=CAD&symbols=THB', p:j => ({rate:j.rates.THB, date:j.date})}
  ];
  for (const s of sources) {
    try {
      const r = await fetch(s.u, {cache:'no-store'});
      if (!r.ok) continue;
      const v = s.p(await r.json());
      if (!(v.rate > 5 && v.rate < 100)) continue;
      S.fx = {rate:v.rate, date:v.date, day:today(), src:s.n};
      fxState = 'ok'; applyFx(); return;
    } catch (e) {}
  }
  fxState = 'fail'; renderSimOut();
}

  if (!VIEWS[S.tab]) S.tab = 'ready';
  document.documentElement.lang = S.lang;
  document.title = S.lang === 'th' ? 'คู่มือ Work & Study สู่ PR แคนาดา 2027 ถึง 2028' : 'Canada Work & Study to PR Guide 2027 to 2028';
  document.getElementById('brand').textContent = T(UI.brand);
  for (const l of ['th','en']) {
    const b = document.getElementById('lang-' + l);
    b.className = S.lang === l ? 'on' : '';
    b.setAttribute('aria-pressed', S.lang === l);
  }
  document.getElementById('tb-title').innerHTML = `<span class="tb-full tb-sec">${T(tabL(S.tab))}</span><span class="tb-short">${T(UI.tabs.find(t => t.id === S.tab).s)}</span>`;
  const dark = S.theme === 'dark', tb = document.getElementById('theme-btn');
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  tb.innerHTML = ic(dark ? 'sun' : 'moon');
  tb.setAttribute('aria-label', T(dark ? {en:'Switch to light theme', th:'เปลี่ยนเป็นธีมสว่าง'} : {en:'Switch to dark theme', th:'เปลี่ยนเป็นธีมมืด'}));
  tb.title = tb.getAttribute('aria-label');
  document.getElementById('btabs').innerHTML = UI.tabs.map(t => `<button class="${S.tab===t.id?'on':''}" role="tab" aria-selected="${S.tab===t.id}" aria-label="${T(t.l)}" data-act="tab" data-v="${t.id}">${ic(t.icon)}<span>${T(t.s)}</span></button>`).join('');
  document.getElementById('disclaimer').textContent = T(UI.disclaimer);
  document.getElementById('links').innerHTML = `
    <h2 class="text-[18px] font-semibold flex items-center gap-2"><span style="color:var(--blue)">${ic('refresh-cw')}</span>${T(LINKS.title)}</h2>
    <p class="muted text-[14px] mt-1 mb-3">${T(LINKS.sub)}</p>
    <div class="grid sm:grid-cols-2 gap-x-8">${LINKS.items.map(x => `<a href="${x.u}" target="_blank" rel="noopener noreferrer" class="tap flex items-start gap-2 py-3 text-[15px] hover:underline" style="color:var(--blue);border-top:1px solid var(--line);align-items:flex-start">${ic('external-link','icon-sm')}<span style="margin-top:-3px">${T(x.l)}</span></a>`).join('')}</div>`;
  const y = window.scrollY;
  const app = document.getElementById('app');
  app.innerHTML = VIEWS[S.tab]();
  renderSimOut(); updateChip();
  icons();
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  save();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === 'lang') { S.lang = v; render(true); }
  else if (act === 'theme') { S.theme = S.theme === 'dark' ? 'light' : 'dark'; render(true); }
  else if (act === 'tab') { S.tab = v; render(false); }
  else if (act === 'quiz') { S.quiz[b.dataset.q] = +b.dataset.o; render(true); }
  else if (act === 'quizreset') { S.quiz = {}; render(true); }
  else if (act === 'goroad') { S.scenario = v; S.tab = 'roadmap'; render(false); }
  else if (act === 'filter') { S.filter = v; render(true); }
  else if (act === 'scenario') { S.scenario = v; render(true); }
  else if (act === 'sim-type') { S.sim.type = v; S.sim.tuition = SIMC.types[v].def; render(true); }
  else if (act === 'sim-living') { S.sim.living = v; render(true); }
  else if (act === 'simreset') { S.sim = Object.assign({}, DEFAULTS.sim); if (S.fx.rate) S.sim.rate = +S.fx.rate.toFixed(2); render(true); }
  else if (act === 'fxlive') { S.sim.rateAuto = true; applyFx(); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset.sim; if (!k) return;
  const v = parseFloat(e.target.value);
  if (!isFinite(v) || v <= 0 && k !== 'hours') return;
  S.sim[k] = v; if (k === 'rate') S.sim.rateAuto = false;
  save(); renderSimOut(); icons();
});
document.addEventListener('input', e => {
  const k = e.target.dataset.conv; if (!k) return;
  const v = parseFloat(e.target.value) || 0, r = S.sim.rate || 24;
  if (k === 'cad') document.getElementById('conv-thb').value = Math.round(v * r);
  else document.getElementById('conv-cad').value = Math.round(v / r * 100) / 100;
});
document.addEventListener('change', e => {
  if (e.target.dataset.step) { S.steps[e.target.dataset.step] = e.target.checked; render(true); return; }
  const id = e.target.dataset.check; if (!id) return;
  S.check[id] = e.target.checked; save();
  e.target.closest('.check').classList.toggle('done', e.target.checked);
  const c = checkStats();
  document.getElementById('ck-num').textContent = `${c.done} / ${c.total} ${T(CHECK.done)}`;
  document.getElementById('ck-bar').style.width = c.pct + '%';
});

render(false);
loadFx();
</script>
</body>
</html>
