<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Canada Work &amp; Study to PR Guide 2027 to 2028</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  /* ============ AppKit (macOS) with Liquid Glass materials ============ */
  :root{
    color-scheme:light;
    --window:#EEF1F6; --toolbar:rgba(255,255,255,.62);
    --card:rgba(255,255,255,.6); --bg:rgba(0,0,0,.045);
    --glass:rgba(255,255,255,.55); --glass-strong:rgba(255,255,255,.86); --glass-border:rgba(255,255,255,.75);
    --glass-shadow:0 10px 30px rgba(30,40,70,.12),0 1px 3px rgba(30,40,70,.08);
    --specular:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.25);
    --wall:radial-gradient(60vw 55vh at 10% 6%,rgba(110,165,255,.42),transparent 62%),
        
           radial-gradient(48vw 50vh at 92% 14%,rgba(255,140,165,.28),transparent 60%),
        
           radial-gradient(60vw 60vh at 72% 96%,rgba(95,215,205,.32),transparent 62%),
        
           radial-gradient(45vw 45vh at 22% 88%,rgba(175,150,255,.24),transparent 60%);
    --line:rgba(0,0,0,.09); --line2:rgba(0,0,0,.15);
    --ink:rgba(0,0,0,.88); --ink2:rgba(0,0,0,.66); --ink3:rgba(0,0,0,.6);
    --ctl:#FFFFFF; --field:#FFFFFF; --knob:#FFFFFF; --seg-on:#FFFFFF;
    --ctl-border:rgba(0,0,0,.22); --track:rgba(120,120,128,.26); --sel:rgba(0,0,0,.09); --hover:rgba(0,0,0,.045);
    --accent:#0070E0; --blue:#0064D9; --blue-soft:rgba(0,122,255,.12);
    --green:#1D7A33; --green-soft:rgba(52,199,89,.18);
    --amber:#9A4D00; --amber-soft:rgba(255,149,0,.16);
    --red:#C4281C; --red-soft:rgba(255,59,48,.12);
    --gray-soft:rgba(120,120,128,.14); --ring:rgba(0,122,255,.5);
    --shadow-ctl:0 .5px 1px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.16);
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --window:#0C0E13; --toolbar:rgba(44,47,58,.58);
    --card:rgba(255,255,255,.075); --bg:rgba(255,255,255,.07);
    --glass:rgba(52,56,68,.5); --glass-strong:rgba(120,126,142,.5); --glass-border:rgba(255,255,255,.16);
    --glass-shadow:0 12px 34px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.3);
    --specular:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.05);
    --wall:radial-gradient(60vw 55vh at 10% 6%,rgba(40,95,220,.42),transparent 62%),
        
           radial-gradient(48vw 50vh at 92% 14%,rgba(190,50,95,.28),transparent 60%),
        
           radial-gradient(60vw 60vh at 72% 96%,rgba(20,140,135,.32),transparent 62%),
        
           radial-gradient(45vw 45vh at 22% 88%,rgba(100,70,200,.28),transparent 60%);
    --line:rgba(255,255,255,.1); --line2:rgba(255,255,255,.17);
    --ink:rgba(255,255,255,.9); --ink2:rgba(255,255,255,.68); --ink3:rgba(255,255,255,.6);
    --ctl:#565659; --field:rgba(255,255,255,.07); --knob:#D4D4D6; --seg-on:#6A6A6E;
    --ctl-border:rgba(255,255,255,.24); --track:rgba(255,255,255,.2); --sel:rgba(255,255,255,.13); --hover:rgba(255,255,255,.06);
    --accent:#0070E0; --blue:#5AAEFF; --blue-soft:rgba(10,132,255,.24);
    --green:#32D74B; --green-soft:rgba(48,209,88,.2);
    --amber:#FFA826; --amber-soft:rgba(255,159,10,.2);
    --red:#FF6F66; --red-soft:rgba(255,69,58,.2);
    --gray-soft:rgba(255,255,255,.1); --ring:rgba(10,132,255,.6);
    --shadow-ctl:0 .5px 1px rgba(0,0,0,.45),inset 0 .5px 0 rgba(255,255,255,.16);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;scrollbar-color:rgba(128,128,128,.5) transparent}
  body{margin:0;background:var(--window);color:var(--ink);font-size:15px;line-height:1.6;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Sukhumvit Set","Noto Sans Thai",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  html[lang="th"] body{font-family:-apple-system,BlinkMacSystemFont,"Sukhumvit Set","Noto Sans Thai","Inter",sans-serif}
  h1,h2,h3,h4{margin:0;letter-spacing:-0.012em;line-height:1.3;text-wrap:balance}
  html[lang="th"] h1,html[lang="th"] h2,html[lang="th"] h3,html[lang="th"] h4{letter-spacing:0;line-height:1.45}
  p{margin:0}
  a{color:var(--blue);text-underline-offset:3px}
  /* the wallpaper the glass refracts; fixed so content slides over it */
  body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--wall),var(--window)}
  ::selection{background:rgba(0,122,255,.28)}
  input{caret-color:var(--accent);accent-color:var(--accent)}

  /* ---------- window: sidebar + toolbar + content ---------- */
  .app{display:flex;min-height:100vh}
  .sidebar{display:none}
  .content{flex:1;min-width:0}
  .toolbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
    height:calc(56px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0}
  /* scroll edge effect: content blurs and fades as it passes under the floating toolbar items */
  .toolbar::before{content:"";position:absolute;inset:0 0 -14px 0;z-index:-1;pointer-events:none;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    -webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
  .toolbar .seg button{min-height:28px}
  .toolbar .seg{flex:none;flex-wrap:nowrap}
  /* phones: the dock already names the current page, so the toolbar keeps its controls on one line instead of a clipped title */
  @media (max-width:419px){.tb-title > *{display:none}}
  .tb-title{font-size:15px;font-weight:700;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 16px}
  #app h1{font-size:26px;font-weight:700}
  #app h1 + p{font-size:15px;margin-top:8px}
  @media (min-width:1024px){
    .toolbar{padding-left:28px;padding-right:28px}
    .wrap{padding:28px 28px}
  }
  .tb-sec{color:var(--ink2);font-weight:600;margin-left:12px}
  .tb-btn{width:34px;height:34px;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;padding:0}
  .appicon{width:28px;height:28px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;
    background:linear-gradient(#3F9BFF,#0068D6);box-shadow:0 1px 2px rgba(0,0,0,.25),inset 0 .5px 0 rgba(255,255,255,.35)}
  .sb-head{font-size:11.5px;font-weight:600;color:var(--ink3);padding:4px 8px 4px}
  .sb-row{width:100%;display:flex;align-items:center;gap:8px;min-height:36px;padding:4px 10px;border:0;background:none;border-radius:12px;
    font:inherit;font-size:14px;line-height:1.35;color:var(--ink);cursor:pointer;text-align:left}
  .sb-row svg{width:16px;height:16px;color:var(--blue);flex:none}
  .sb-row .cnt{margin-left:auto;font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .sb-row.on{background:var(--glass-strong);font-weight:600;box-shadow:0 2px 8px rgba(30,40,70,.12),var(--specular)}
  @media (hover:hover){.sb-row:not(.on):hover{background:var(--hover)}}

  /* ---------- NSBox style groups ---------- */
  .card{background:var(--card);border:1px solid var(--glass-border);border-radius:20px;padding:20px;box-shadow:0 6px 22px rgba(30,40,70,.07),var(--specular)}
  .card-warn{background:var(--amber-soft);border-color:transparent}
  .grp{font-size:15px;font-weight:700;margin:0 0 8px 2px}
  .muted{color:var(--ink2)} .faint{color:var(--ink3)}
  .eyebrow{font-size:12.5px;font-weight:500;color:var(--ink3)}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;line-height:1.5}
  .b-green{background:var(--green-soft);color:var(--green)}
  .b-amber{background:var(--amber-soft);color:var(--amber)}
  .b-red{background:var(--red-soft);color:var(--red)}
  .b-blue{background:var(--blue-soft);color:var(--blue)}
  .b-gray{background:var(--gray-soft);color:var(--ink2)}
  /* Citations */
  sup.cite{font-size:.68em;line-height:0;vertical-align:super;margin-left:1px;white-space:nowrap}
  sup.cite a{color:var(--blue);font-weight:600;text-decoration:none;padding:0 2px;border-radius:4px;font-variant-numeric:tabular-nums}
  sup.cite a:hover{background:var(--blue-soft)}
  sup.cite a::before{content:'['}sup.cite a::after{content:']'}
  .reflist{counter-reset:none;list-style:none;margin:0;padding:0}
  .reflist li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px;scroll-margin-top:80px;scroll-margin-bottom:110px;border-radius:8px;transition:background .6s}
  .reflist li.flash{background:var(--blue-soft)}
  .reflist .rn{color:var(--blue);font-weight:600;min-width:2.2em;font-variant-numeric:tabular-nums}
  .reflist a{color:var(--blue)}
  .reflist a:hover{text-decoration:underline}
  /* NOC chips */
  .noc{display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;border-radius:10px;background:var(--gray-soft);color:var(--ink);font-size:13.5px;line-height:1.35;text-decoration:none}
  .noc:hover{background:var(--blue-soft)}
  .noc b{color:var(--blue);font-variant-numeric:tabular-nums;font-weight:600}
  .noc i{font-style:normal;color:var(--ink3);font-size:12px}
  /* Field cards */
  details.fcard>summary{list-style:none;cursor:pointer}
  details.fcard>summary::-webkit-details-marker{display:none}
  details.fcard .chev{transition:transform .2s;color:var(--ink3)}
  details.fcard[open] .chev{transform:rotate(90deg)}
  .grp-h{font-size:13px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.04em;margin:26px 0 10px}
  .icon{width:18px;height:18px;flex:none} .icon-sm{width:14px;height:14px;flex:none}
  .tile{width:36px;height:36px;border-radius:11px;box-shadow:var(--specular);display:flex;align-items:center;justify-content:center;flex:none}
  ul.clean{list-style:none;margin:0;padding:0}
  ul.clean li{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:15px}
  ul.clean li svg{margin-top:5px}
  .row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
  .row:first-child{border-top:0}
  .big{font-size:28px;font-weight:700;letter-spacing:-0.015em;line-height:1.2}
  .num{font-variant-numeric:tabular-nums}
  .pos{color:var(--green)} .neg{color:var(--red)}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px}
  .stat-sub{display:block;font-size:13px;font-weight:400;color:var(--ink2);margin-top:2px}

  /* ---------- NSButton ---------- */
  .btn{border:1px solid var(--glass-border);border-radius:999px;min-height:32px;padding:4px 16px;font:inherit;font-size:14px;font-weight:500;line-height:1.4;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--glass-strong);color:var(--ink);
    box-shadow:0 3px 10px rgba(30,40,70,.12),var(--specular);transition:transform .18s cubic-bezier(.2,.8,.2,1)}
  .btn-primary{border-color:rgba(255,255,255,.28);background:var(--accent) linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0) 55%);color:#fff;
    box-shadow:0 5px 14px rgba(0,90,200,.32),inset 0 1px 0 rgba(255,255,255,.5)}
  .btn:active{transform:scale(.97)}
  .btn-ghost{color:var(--ink)}
  .btn:active{filter:brightness(.93)}

  /* ---------- NSSegmentedControl ---------- */
  .seg{display:inline-flex;flex-wrap:wrap;background:var(--gray-soft);border-radius:18px;padding:3px;gap:2px;box-shadow:inset 0 0 0 .5px var(--line)}
  .seg button{border:0;background:transparent;min-height:28px;padding:3px 14px;border-radius:999px;font:inherit;font-size:13.5px;font-weight:500;color:var(--ink);cursor:pointer}
  .seg button.on{background:var(--glass-strong);box-shadow:0 2px 6px rgba(30,40,70,.16),var(--specular)}
  @media (hover:hover){.seg button:not(.on):hover{background:var(--hover)}}

  /* ---------- radio buttons (quiz) ---------- */
  .opt{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:transparent;border-radius:12px;
    padding:7px 10px;font:inherit;font-size:15px;line-height:1.5;color:var(--ink);cursor:pointer}
  .opt::before{content:"";flex:none;width:16px;height:16px;margin-top:3px;border-radius:50%;background:var(--ctl);
    box-shadow:inset 0 0 0 1px var(--ctl-border),inset 0 1px 1.5px rgba(0,0,0,.08)}
  .opt.on::before{background:radial-gradient(circle,#fff 0 2.8px,var(--accent) 3.4px);box-shadow:inset 0 0 0 .5px rgba(0,60,140,.5)}
  @media (hover:hover){.opt:hover{background:var(--hover)}}
  .opt:active{background:var(--sel)}

  /* ---------- checkbox ---------- */
  .check{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
  .check:first-child{border-top:0}
  .check input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border-radius:4px;flex:none;margin:4px 0 0;cursor:pointer;position:relative;
    background:var(--ctl);box-shadow:inset 0 0 0 1px var(--ctl-border),inset 0 1px 1.5px rgba(0,0,0,.08)}
  .check input:checked{background:var(--accent) linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,0));box-shadow:inset 0 0 0 .5px rgba(0,60,140,.5)}
  .check input:checked::after{content:"";position:absolute;left:5.5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .check.done .ct{color:var(--ink3);text-decoration:line-through}

  /* ---------- progress, slider, text field ---------- */
  .bar{height:6px;background:var(--track);border-radius:3px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .35s cubic-bezier(.2,.8,.2,1)}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;outline-offset:6px;margin:12px 0;touch-action:pan-y;
    background:linear-gradient(to right,var(--accent) var(--p,50%),var(--track) var(--p,50%))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--knob);cursor:pointer;
    box-shadow:0 .5px 2px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.2)}
  input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:var(--knob);cursor:pointer;
    box-shadow:0 .5px 2px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.2)}
  .numin{border:0;border-radius:10px;min-height:30px;padding:2px 8px;width:96px;font:inherit;font-size:14px;text-align:right;color:var(--ink);
    background:var(--field);box-shadow:inset 0 0 0 1px var(--ctl-border),inset 0 1px 1.5px rgba(0,0,0,.06)}
  button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--ring);outline-offset:1px}
  .numin:focus-visible{outline-offset:0}

  /* ---------- NSTableView (costs) ---------- */
  .tbl{padding:0;overflow:hidden}
  .thead{display:none}
  .trow{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;align-items:baseline;padding:10px 14px}
  .trow > :first-child{grid-column:1 / -1}
  .trow:nth-child(odd){background:var(--hover)}
  .trow .amt{font-variant-numeric:tabular-nums}
  .trow .amt + .amt{text-align:right;font-weight:600}
  .trow.total{border-top:1px solid var(--line2);font-weight:700;background:none}
  @media (min-width:640px){
    .thead,.trow{grid-template-columns:minmax(0,1fr) 150px 190px}
    .thead{display:grid;gap:16px;padding:6px 14px;font-size:12px;font-weight:600;color:var(--ink3);border-bottom:1px solid var(--line)}
    .thead > :not(:first-child),.trow .amt{text-align:right}
    .trow > :first-child{grid-column:auto}
    .trow .cur{display:none}
  }

  /* ---------- timeline ---------- */
  .tl{position:relative;padding-left:40px}
  .tl::before{content:"";position:absolute;left:12px;top:8px;bottom:8px;width:2px;background:var(--track)}
  .tl-step{position:relative;padding-bottom:16px}
  .tl-step:last-child{padding-bottom:0}
  .tl-dot{position:absolute;left:-40px;top:0;width:26px;height:26px;border-radius:50%;background:var(--glass-strong);box-shadow:inset 0 0 0 1.5px var(--blue),0 2px 6px rgba(30,40,70,.12);color:var(--blue);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
  .tl-dot.goal{background:var(--green);box-shadow:none;color:#fff}
  :root[data-theme="dark"] .tl-dot.goal{color:#0C0E13}
  .tl-dot.risk{box-shadow:inset 0 0 0 1.5px var(--amber);color:var(--amber)}

  .fade{animation:fade .25s cubic-bezier(.2,.8,.2,1)}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}.bar>i{transition:none}html{scroll-behavior:auto}}

  /* ---------- phone and tablet: bottom tab bar ---------- */
  .bnav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));
    background:var(--toolbar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
    border-top:1px solid var(--line2);padding:4px max(4px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left))}
  .bnav button{border:0;background:none;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    min-height:50px;min-width:0;font-size:11px;font-weight:500;line-height:1.2;color:var(--ink2);cursor:pointer;border-radius:8px;padding:4px 0}
  .bnav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bnav button.on{color:var(--blue);font-weight:600}
  .bnav button:active{background:var(--hover)}
  .bnav svg{width:22px;height:22px}
  @media (max-width:400px){.bnav button{font-size:10.5px}.bnav svg{width:21px;height:21px}}
  /* ---------- Budget charts (dataviz reference palette, validated on the card surfaces) ---------- */
  :root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--grid:rgba(0,0,0,.08);--axis:rgba(0,0,0,.22);--crit:#d03b3b;--warn:#b26b00;--good:#1D7A33}
  :root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--grid:rgba(255,255,255,.08);--axis:rgba(255,255,255,.22);--crit:#ff6f66;--warn:#ffa826;--good:#32d74b}
  .hero{font-size:44px;font-weight:700;letter-spacing:-0.02em;line-height:1.1}
  @media (max-width:640px){.hero{font-size:34px}}
  .viz figcaption{margin-bottom:8px}
  .viz svg{width:100%;height:auto;display:block;overflow:visible}
  .viz .ax{font-size:12px;fill:var(--ink3);font-variant-numeric:tabular-nums}
  .viz .lbl{font-size:13px;fill:var(--ink2);font-weight:500}
  .viz .val{font-size:12.5px;fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .viz .grid{stroke:var(--grid);stroke-width:1}
  .viz .base{stroke:var(--axis);stroke-width:1}
  .viz .band{fill:var(--s1);opacity:.07}
  .viz .s1-line{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
  .viz .s1-area{fill:var(--s1);opacity:.1}
  .viz .s1-dot{fill:var(--s1);stroke:var(--card-solid,#fff);stroke-width:2}
  .viz .crit{stroke:var(--crit);stroke-width:1.5}
  .viz .hit{fill:transparent;cursor:crosshair}
  .viz .hit.hov{fill:var(--s1);opacity:.08}
  .viz path.s1{fill:var(--s1)} .viz path.s2{fill:var(--s2)}

const T = o => (o == null ? '' : (typeof o === 'function' ? T(o()) : (typeof o === 'string' ? o : (o[S.lang] ?? o.en))));
const rnd = (n, to) => Math.round(n / to) * to;
const rangeStr = (a, b) => a === b ? fmt(a) : fmt(a) + (S.lang === 'th' ? ' ถึง ' : ' to ') + fmt(b);
/* amounts in both currencies at the current rate; unit is the currency the price is set in */
function money(a, b, unit){
  const r = S.sim.rate || 24;
  if (a === 0 && b === 0) { const f = S.lang === 'th' ? 'ฟรี' : 'Free'; return {cad:f, thb:f}; }
  return unit === 'thb'
    ? {cad:rangeStr(rnd(a/r,5), rnd(b/r,5)), thb:rangeStr(a,b)}
    : {cad:rangeStr(a,b), thb:rangeStr(rnd(a*r,100), rnd(b*r,100))};
}
function stack(a, b){
  const m = money(a, b, 'cad');
  return `CAD ${m.cad}<span class="stat-sub num">${S.lang === 'th' ? `ประมาณ ${m.thb} บาท` : `about THB ${m.thb}`}</span>`;
}
function inline(a, b){
  const m = money(a, b == null ? a : b, 'cad');
  return S.lang === 'th' ? `CAD ${m.cad} (ประมาณ ${m.thb} บาท)` : `CAD ${m.cad} (about THB ${m.thb})`;
}
const fmt = n => Math.round(n).toLocaleString('en-US');
const cad = n => 'CAD ' + fmt(n);
const thb = n => 'THB ' + fmt(n);
/* Simulator display currency, chosen by the user: 'thb', 'cad' or 'both'. Values are always stored in CAD. */
const curOf = () => (['thb','cad','both'].includes(S.sim.cur) ? S.sim.cur : 'both');
function mny(v, o = {}){
  const r = S.sim.rate || 24, cu = o.cur || curOf(), a = Math.abs(v);
  const sg = o.sign ? (v < 0 ? '-' : '+') : (v < 0 ? '-' : '');
  const C = sg + 'CAD ' + (o.dec ? a.toFixed(2) : fmt(a)), B = sg + 'THB ' + fmt(a * r);
  if (cu === 'cad') return C;
  if (cu === 'thb') return B;
  return o.stack ? `${C}<span class="msub">${B}</span>` : `${C} <span class="msub-i">(${B})</span>`;
}

  whySame:{en:'Why the monthly + and − numbers do not change when you switch program type: they depend only on your work hours, wage and housing. The program type changes the tuition, the money to show, and how many months are study, Co-op or break. Compare the types in the table below.', th:'ทำไมตัวเลข + และ − ต่อเดือนไม่เปลี่ยนเมื่อเปลี่ยนประเภทหลักสูตร: เพราะตัวเลขนี้ขึ้นกับชั่วโมงทำงาน ค่าจ้าง และที่พักเท่านั้น สิ่งที่ประเภทหลักสูตรเปลี่ยนคือค่าเล่าเรียน เงินที่ต้องแสดง และจำนวนเดือนเรียน Co-op หรือปิดเทอม ดูการเปรียบเทียบในตารางด้านล่าง'},
  left:{en:'money left', th:'เงินคงเหลือ'}, paidY2:{en:'year-2 tuition paid', th:'จ่ายค่าเล่าเรียนปี 2'},
  c1t:{en:'Your money, month by month', th:'เงินของคุณ เดือนต่อเดือน'},
  c1s:{en:'Starts at the IRCC living-cost amount after first-year tuition is paid. It falls when pay is less than living costs, rises when you earn more, and drops at month 12 if you pay a second year of tuition. Below zero means you need extra money.', th:'เริ่มจากยอดค่าครองชีพของ IRCC หลังจ่ายค่าเล่าเรียนปีแรก เส้นจะลดลงเมื่อรายได้น้อยกว่าค่าครองชีพ เพิ่มขึ้นเมื่อรายได้มากกว่า และลดลงที่เดือนที่ 12 ถ้าต้องจ่ายค่าเล่าเรียนปีที่ 2 ถ้าต่ำกว่าศูนย์แปลว่าต้องหาเงินเพิ่ม'},
  axisM:{en:'Months after arrival (CAD)', th:'เดือนหลังเดินทางถึง (CAD)'},
  endLbl:{en:n => `After ${n} months:`, th:n => `ครบ ${n} เดือน:`},
  y2mark:{en:'Year-2 tuition', th:'ค่าเรียนปี 2'},
  c2t:{en:'Monthly pay vs living costs', th:'รายได้ต่อเดือนเทียบค่าครองชีพ'},
  c2s:{en:'When the blue bar is shorter than the orange bar, you use savings in those months.', th:'ถ้าแท่งสีน้ำเงินสั้นกว่าแท่งสีส้ม แปลว่าเดือนเหล่านั้นต้องดึงเงินเก็บมาใช้'},
  c3t:{en:n => `Where the money goes over ${n} months`, th:n => `เงินตลอด ${n} เดือนถูกใช้ไปกับอะไรบ้าง`},
  c3s:{en:'Tuition, living costs for the whole program and setup. Total:', th:'ค่าเล่าเรียน ค่าครองชีพตลอดหลักสูตร และค่าตั้งตัว รวม:'},
  table:{en:'Show as a table', th:'ดูเป็นตาราง'},
  cmpT:{en:'Compare the three program types with your settings', th:'เปรียบเทียบ 3 ประเภทหลักสูตรด้วยค่าที่คุณตั้งไว้'},
  cmpSub:{en:'Same start year, length, housing, hours and wage; each type uses its typical tuition.', th:'ใช้ปีที่เริ่มเรียน ระยะเวลา ที่พัก ชั่วโมงทำงาน และค่าจ้างเดียวกัน แต่ละประเภทใช้ค่าเล่าเรียนทั่วไปของตัวเอง'},
  cTu:{en:'Tuition, year 1', th:'ค่าเล่าเรียนปีแรก'}, cShow:{en:'Money to show', th:'เงินที่ต้องแสดง'},
  cMonths:{en:'Months: study / Co-op / break', th:'เดือน: เรียน / Co-op / ปิดเทอม'},
  cNetS:{en:'Per month in study terms', th:'ต่อเดือนช่วงเทอมเรียน'}, cEnd:{en:'Money at the end', th:'เงินคงเหลือตอนจบ'},
  cExtra:{en:'Extra money needed', th:'เงินที่ต้องหาเพิ่ม'}, cCw:{en:'Typical Co-op wage', th:'ค่าจ้าง Co-op ทั่วไป'},
  cNote:{en:'The study-term monthly number is the same for all three because it depends only on work and housing. The differences come from tuition and the months of Co-op or breaks.', th:'ตัวเลขต่อเดือนช่วงเทอมเรียนเท่ากันทั้ง 3 ประเภท เพราะขึ้นกับงานและที่พักเท่านั้น ส่วนที่ต่างกันมาจากค่าเล่าเรียนและจำนวนเดือน Co-op หรือปิดเทอม'},
  vT:{en:'What your numbers mean', th:'ตัวเลขของคุณหมายความว่าอะไร'},
  verdict:{
    good:{icon:'circle-check', l:{en:'Healthy plan', th:'แผนการเงินแข็งแรง'}, d:{en:'Your money at the end is the same or higher than at the start, so you have a cushion for surprises.', th:'เงินตอนจบเท่าเดิมหรือมากกว่าตอนเริ่ม จึงมีเงินสำรองสำหรับเหตุไม่คาดฝัน'}},
    warn:{icon:'triangle-alert', l:{en:'Works, but your savings shrink', th:'พอไหว แต่เงินเก็บลดลง'}, d:{en:'You do not run out, but you end with less than you started. Plan a buffer or more work hours.', th:'เงินไม่หมด แต่ตอนจบจะเหลือน้อยกว่าตอนเริ่ม ควรมีเงินสำรองเพิ่มหรือทำงานมากขึ้น'}},
    need:{icon:'wallet', l:{en:'You need extra money for year 2', th:'ต้องเตรียมเงินเพิ่มสำหรับปีที่ 2'}, d:{en:'Year one is covered, but paying the second year of tuition takes your balance below zero. Plan where the extra amount will come from before you go.', th:'ปีแรกเงินพอ แต่การจ่ายค่าเล่าเรียนปีที่ 2 ทำให้เงินติดลบ ควรวางแผนว่าเงินส่วนที่ขาดจะมาจากไหนก่อนเดินทาง'}},
    crit:{icon:'octagon-alert', l:{en:'Not enough money: change the plan', th:'เงินไม่พอ: ต้องปรับแผน'}, d:{en:'Your living money runs out within the first year. Choose cheaper housing or city, a program with Co-op, more work hours, or bring more savings.', th:'เงินค่าครองชีพจะหมดภายในปีแรก ลองเลือกที่พักหรือเมืองที่ถูกกว่า หลักสูตรที่มี Co-op ทำงานมากขึ้น หรือเตรียมเงินเก็บเพิ่ม'}}
  },
  a1:{en:(show, tu, pr) => `<b>Money to show:</b> your bank must show ${show} before you apply. It is not all spent at once: ${tu} pays first-year tuition, and ${pr} is the living money IRCC wants to see so it believes you can live for a year without relying on a job.`,
      th:(show, tu, pr) => `<b>เงินที่ต้องแสดง:</b> บัญชีต้องมี ${show} ก่อนยื่นขอวีซ่า เงินนี้ไม่ได้ใช้หมดทีเดียว ${tu} เป็นค่าเล่าเรียนปีแรก และ ${pr} คือเงินค่าครองชีพที่ IRCC ต้องการเห็น เพื่อมั่นใจว่าคุณอยู่ได้ 1 ปีโดยไม่ต้องพึ่งงาน`},
  aWhy:{en:'<b>How to read + and −:</b> each month, take-home pay minus living costs. A plus means you add to savings that month; a minus means you spend savings.', th:'<b>วิธีอ่านเครื่องหมาย + และ −:</b> แต่ละเดือนคือรายได้สุทธิลบค่าครองชีพ ถ้าเป็นบวกแปลว่าเดือนนั้นมีเงินเก็บเพิ่ม ถ้าเป็นลบแปลว่าต้องใช้เงินเก็บ'},
  a2ok:{en:(m, p, v) => `<b>Study months (${m}):</b> part-time pay covers ${p}% of living costs, leaving ${v} each month to save.`, th:(m, p, v) => `<b>เดือนที่เรียน (${m} เดือน):</b> ค่าจ้างพาร์ตไทม์ครอบคลุมค่าครองชีพ ${p}% เหลือเก็บเดือนละ ${v}`},
  a2short:{en:(m, p, v) => `<b>Study months (${m}):</b> part-time pay covers only ${p}% of living costs. You take ${v} from savings each month.`, th:(m, p, v) => `<b>เดือนที่เรียน (${m} เดือน):</b> ค่าจ้างพาร์ตไทม์ครอบคลุมค่าครองชีพแค่ ${p}% ต้องดึงเงินเก็บมาใช้เดือนละ ${v}`},
  a3ok:{en:(n, h) => `<b>Break-even:</b> to cover living costs from work alone in study months you need about <strong class="num">${n} hours a week</strong> at this wage (you set ${h}). That is within the 24-hour limit, but steady hours are not guaranteed.`, th:(n, h) => `<b>จุดคุ้มทุน:</b> ถ้าจะให้ค่าจ้างช่วงเทอมเรียนพอค่าครองชีพ ต้องทำงานประมาณ <strong class="num">${n} ชั่วโมงต่อสัปดาห์</strong> ที่ค่าจ้างนี้ (ตอนนี้ตั้งไว้ ${h}) ยังอยู่ในขีดจำกัด 24 ชั่วโมง แต่ไม่แน่ว่าจะได้ชั่วโมงงานสม่ำเสมอ`},
  a3no:{en:n => `<b>Break-even:</b> in study months you would need about <strong class="num">${n} hours a week</strong> to cover living costs, more than the 24-hour limit. Savings must fill the gap. [[offc]]`, th:n => `<b>จุดคุ้มทุน:</b> ช่วงเทอมเรียนต้องทำงานประมาณ <strong class="num">${n} ชั่วโมงต่อสัปดาห์</strong> จึงจะพอค่าครองชีพ ซึ่งเกินขีดจำกัด 24 ชั่วโมง ส่วนที่ขาดต้องใช้เงินเก็บ [[offc]]`},
  a4ok:{en:(m, v, w) => `<b>Co-op months (${m}):</b> a full-time Co-op job at about CAD ${w} an hour lets you save about ${v} a month.`, th:(m, v, w) => `<b>เดือนที่ทำ Co-op (${m} เดือน):</b> งาน Co-op เต็มเวลาค่าจ้างประมาณ CAD ${w} ต่อชั่วโมง ทำให้เก็บเงินได้ประมาณเดือนละ ${v}`},
  a4short:{en:(m, v, w) => `<b>Co-op months (${m}):</b> even a full-time Co-op job at CAD ${w} an hour leaves you ${v} short each month. Check the wage or housing choice.`, th:(m, v, w) => `<b>เดือนที่ทำ Co-op (${m} เดือน):</b> แม้ทำงาน Co-op เต็มเวลาค่าจ้าง CAD ${w} ต่อชั่วโมง ยังขาดเดือนละ ${v} ควรตรวจค่าจ้างหรือที่พัก`},
  a8ok:{en:(m, v) => `<b>Break or after-graduation months (${m}):</b> if you find full-time hours at your part-time wage, you save about ${v} a month. Full-time hours are not guaranteed.`, th:(m, v) => `<b>เดือนปิดเทอมหรือหลังเรียนจบ (${m} เดือน):</b> ถ้าได้ชั่วโมงทำงานเต็มเวลาที่ค่าจ้างงานพาร์ตไทม์ จะเก็บเงินได้ประมาณเดือนละ ${v} แต่ไม่แน่ว่าจะได้งานเต็มเวลา`},
  a8short:{en:(m, v) => `<b>Break or after-graduation months (${m}):</b> even full-time hours at your part-time wage leave you ${v} short each month.`, th:(m, v) => `<b>เดือนปิดเทอมหรือหลังเรียนจบ (${m} เดือน):</b> แม้ทำงานเต็มเวลาที่ค่าจ้างงานพาร์ตไทม์ ยังขาดเดือนละ ${v}`},
  a5:{en:(n, st, en, m, lo) => `<b>After ${n} months:</b> your money goes from ${st} to ${en}. Its lowest point is month ${m}, at ${lo}.`, th:(n, st, en, m, lo) => `<b>ครบ ${n} เดือน:</b> เงินจาก ${st} จะเหลือ ${en} จุดต่ำสุดอยู่ที่เดือนที่ ${m} คือ ${lo}`},
  a5out:{en:(m, x) => `<b>Warning:</b> your money goes below zero in <strong>month ${m}</strong>. In total you need about ${x} more than the money to show.`, th:(m, x) => `<b>คำเตือน:</b> เงินจะติดลบใน<strong>เดือนที่ ${m}</strong> รวมแล้วต้องมีเงินเพิ่มจากเงินที่ต้องแสดงประมาณ ${x}`},
  a6:{en:(tu, x) => `<b>Year two:</b> second-year tuition of about ${tu} is due around month 12.${x ? ' After paying it you need about ' + x + ' extra.' : ' Your remaining money covers it.'}`, th:(tu, x) => `<b>ปีที่สอง:</b> ต้องจ่ายค่าเล่าเรียนปีที่ 2 ประมาณ ${tu} ราวเดือนที่ 12${x ? ' หลังจ่ายแล้วต้องหาเงินเพิ่มประมาณ ' + x : ' เงินที่เหลืออยู่พอจ่าย'}`},
  a7:{en:(y, n) => `<b>Start year ${y}:</b> tuition, rent, living costs, wages and the IRCC amount are raised by estimated yearly increases for ${n} year${n > 1 ? 's' : ''}. Check the real figures when schools and IRCC publish them.`, th:(y, n) => `<b>เริ่มเรียนปี ${y}:</b> ค่าเล่าเรียน ค่าเช่า ค่าครองชีพ ค่าจ้าง และยอดของ IRCC ถูกปรับเพิ่มตามอัตราเพิ่มรายปีโดยประมาณ ${n} ปี ควรตรวจตัวเลขจริงเมื่อสถาบันและ IRCC ประกาศ`},
  glossT:{en:'What do these terms mean?', th:'คำศัพท์เหล่านี้หมายถึงอะไร'},
  gloss:[
    {k:{en:'Money to show', th:'เงินที่ต้องแสดง'}, v:{en:'The amount that must be in the bank when you apply for the study permit: first-year tuition plus the IRCC living-cost minimum.', th:'ยอดเงินที่ต้องมีในบัญชีตอนยื่นขอ Study Permit คือค่าเล่าเรียนปีแรก บวกค่าครองชีพขั้นต่ำของ IRCC'}},
    {k:{en:'IRCC living-cost minimum', th:'ค่าครองชีพขั้นต่ำของ IRCC'}, v:{en:'A fixed amount set by the government and updated every year (CAD 23,448 for one person from 1 September 2026). It is proof you can live a year, not a spending budget.', th:'ยอดที่รัฐบาลกำหนดและปรับทุกปี (CAD 23,448 สำหรับ 1 คน ตั้งแต่ 1 กันยายน 2026) เป็นหลักฐานว่าอยู่ได้ 1 ปี ไม่ใช่งบที่ต้องใช้จริง'}},
    {k:{en:'Study term', th:'เทอมเรียน'}, v:{en:'Months with classes. You may work off campus up to 24 hours a week.', th:'เดือนที่มีเรียน ทำงานนอกสถาบันได้สูงสุด 24 ชั่วโมงต่อสัปดาห์'}},
    {k:{en:'Co-op term', th:'เทอม Co-op'}, v:{en:'A paid work term that is part of the program, usually full time. Since 1 April 2026 you need only your study permit and a letter from your school.', th:'ช่วงทำงานแบบได้ค่าจ้างที่เป็นส่วนหนึ่งของหลักสูตร มักเป็นงานเต็มเวลา ตั้งแต่ 1 เมษายน 2026 ใช้แค่ Study Permit กับจดหมายจากสถาบัน'}},
    {k:{en:'Scheduled break', th:'ปิดเทอมตามตาราง'}, v:{en:'A break in the school calendar, such as summer or winter holidays. You may work full time if you study before and after it.', th:'ช่วงหยุดตามปฏิทินของสถาบัน เช่น ปิดเทอมฤดูร้อนหรือฤดูหนาว ทำงานเต็มเวลาได้ถ้าเรียนทั้งก่อนและหลังช่วงนั้น'}},
    {k:{en:'Take-home pay', th:'รายได้สุทธิ'}, v:{en:'What reaches your bank after CPP (5.95%), EI (1.63%) and income tax are taken from each paycheque. At part-time pay almost no income tax is withheld, so about 93% reaches you. Full-time pay has more withheld (this page uses 85%); part of it can come back as a refund, and international students who are tax residents can claim the federal tuition credit. [[payroll]] [[tuitioncr]]', th:'เงินที่เข้าบัญชีจริงหลังหัก CPP (5.95%) EI (1.63%) และภาษีเงินได้จากเงินเดือนแต่ละงวด ถ้าทำงานพาร์ตไทม์แทบไม่ถูกหักภาษี จึงได้รับประมาณ 93% ส่วนงานเต็มเวลาจะถูกหักมากกว่า (หน้านี้ใช้ 85%) ส่วนหนึ่งได้คืนตอนยื่นภาษี และนักศึกษาต่างชาติที่เป็นผู้มีถิ่นที่อยู่ทางภาษีใช้สิทธิ์ลดหย่อนค่าเล่าเรียนของรัฐบาลกลางได้ [[payroll]] [[tuitioncr]]'}},
    {k:{en:'Net per month (+ or −)', th:'คงเหลือต่อเดือน (+ หรือ −)'}, v:{en:'Take-home pay minus rent, food and other costs. A minus number means you use savings that month.', th:'รายได้สุทธิลบค่าเช่า ค่าอาหาร และค่าใช้จ่ายอื่น ถ้าติดลบแปลว่าเดือนนั้นต้องใช้เงินเก็บ'}},
    {k:{en:'Break-even hours', th:'ชั่วโมงคุ้มทุน'}, v:{en:'The weekly work hours at which pay exactly equals living costs.', th:'จำนวนชั่วโมงทำงานต่อสัปดาห์ที่ทำให้รายได้เท่ากับค่าครองชีพพอดี'}}
  ],

  {k:'PAL', f:'Provincial Attestation Letter', c:'permit', s:'pal',
   th:'หนังสือรับรองจากมณฑลว่าคุณได้ที่นั่งในโควตาของมณฑล สถาบันออกให้หลังจ่ายมัดจำ ต้องแนบตอนยื่น Study Permit (นักศึกษาปริญญาโทและปริญญาเอกไม่ต้องใช้)',
   en:"A letter from the province confirming your place within its quota. Your school issues it after your deposit, and you attach it to the study permit application. Master's and doctoral students do not need one."},
  {k:'CAQ', f:"Certificat d'acceptation du Québec", c:'permit', s:'caq',
   th:'หนังสือรับรองการเรียนของรัฐควิเบก ถ้าเรียนในควิเบกต้องได้ CAQ ก่อนยื่น Study Permit',
   en:"Quebec's acceptance certificate. If you study in Quebec you need it before applying for the study permit."},
  {k:{en:'Proof of funds', th:'หลักฐานการเงิน'}, c:'permit', s:'funds', m:['หลักฐานการเงิน','Proof of funds','proof of funds','เงินที่ต้องแสดง','Money to show','money to show'],
   th:'หลักฐานว่ามีเงินพอจ่ายค่าเล่าเรียนปีแรก ค่าครองชีพตามยอดของ IRCC และค่าเดินทางไปและกลับ เช่น Statement หนังสือรับรองจากธนาคาร และเอกสารของสปอนเซอร์',
   en:'Evidence that you can pay first-year tuition, the IRCC living-cost amount and travel to and from Canada: bank statements, a bank letter and sponsor documents.'},
  {k:{en:'IRCC living-cost minimum', th:'ค่าครองชีพขั้นต่ำของ IRCC'}, c:'permit', s:'funds', m:['ค่าครองชีพขั้นต่ำของ IRCC','ค่าครองชีพที่ IRCC กำหนด','IRCC living-cost minimum','IRCC living-cost amount'],
   th:() => `ยอดค่าครองชีพที่ IRCC ให้แสดงสำหรับ 1 ปี ไม่รวมค่าเล่าเรียนและค่าเดินทาง ปัจจุบัน CAD ${fmt(fundsAmt())} สำหรับ 1 คน แอปอ่านยอดนี้จากเว็บ IRCC อัตโนมัติทุกวัน เป็นหลักฐานว่าอยู่ได้ 1 ปี ไม่ใช่งบที่ต้องใช้จริง`,
   en:() => `The living-cost amount IRCC asks you to show for one year, not counting tuition or travel. Now CAD ${fmt(fundsAmt())} for one person; the app reads it from the IRCC page every day. It is proof, not a spending budget.`},
  {k:{en:'Sponsor', th:'สปอนเซอร์'}, c:'permit', s:'funds', m:['สปอนเซอร์','sponsor','Sponsor'],
   th:'คนที่ช่วยออกเงินให้ เช่น พ่อแม่ ต้องมีจดหมายสปอนเซอร์ หลักฐานความสัมพันธ์ (เช่น สูติบัตร) และหลักฐานรายได้และเงินฝากของสปอนเซอร์',
   en:'Someone who pays for you, such as a parent. You need their letter, proof of your relationship (for example a birth certificate) and proof of their income and savings.'},
  {k:'Statement', f:'Bank statement', c:'permit', m:['Statement'],
   th:'รายการเดินบัญชีจากธนาคาร ปกติขอย้อนหลัง 4 ถึง 6 เดือน เพื่อให้เห็นว่าเงินอยู่ในบัญชีมานานพอและมีที่มาชัดเจน',
   en:'Your bank account history. Usually 4 to 6 months are asked for, to show the money has been there a while and where it came from.'},
  {k:{en:'Seasoning the account', th:'เดินบัญชี'}, c:'permit', m:['เดินบัญชี','seasoning'],
   th:'การเก็บเงินไว้ในบัญชีต่อเนื่องหลายเดือนก่อนยื่น เงินก้อนใหญ่ที่เพิ่งโอนเข้ามาโดยอธิบายที่มาไม่ได้ อาจทำให้เจ้าหน้าที่สงสัยว่าเป็นเงินยืมมาชั่วคราว',
   en:'Keeping the money in your account for several months before you apply. A large deposit that just arrived without an explanation can look like borrowed money.'},
  {k:'Co-op', c:'permit', s:'coop', m:['Co-op','co-op'],
   th:'เทอมทำงานแบบได้ค่าจ้างที่เป็นส่วนหนึ่งของหลักสูตร IRCC ไม่จำกัดชั่วโมงต่อสัปดาห์ แต่ช่วงทำงานต้องไม่เกินครึ่งหนึ่งของหลักสูตร ตั้งแต่ 1 เมษายน 2026 นักศึกษาหลังมัธยมใช้จดหมายจากสถาบันแทน Co-op Work Permit',
   en:'A paid work term that is part of your program. IRCC sets no weekly hour limit, but work terms may be at most half of the program. Since 1 April 2026 post-secondary students need only a school letter, not a separate Co-op work permit.'},
  {k:'Co-op Work Permit', c:'permit', s:'coop', m:['Co-op Work Permit','Co-op work permit'],
   th:'ใบอนุญาตทำงานสำหรับเทอม Co-op แบบเดิม ตั้งแต่ 1 เมษายน 2026 นักศึกษาหลังมัธยมไม่ต้องขอแล้ว ใช้ Study Permit กับจดหมายจากสถาบัน',
   en:'The old separate permit for Co-op terms. Since 1 April 2026 post-secondary students use their study permit and a school letter instead.'},
  {k:'Work Permit', c:'permit', m:['Work Permit','work permit'],
   th:'ใบอนุญาตทำงานในแคนาดา มี 2 แบบ: แบบผูกกับนายจ้าง (ทำได้กับนายจ้างที่ระบุเท่านั้น) และแบบเปิด (ทำกับนายจ้างไหนก็ได้)',
   en:'Permission to work in Canada. Employer-specific permits name one employer; open work permits let you work for almost any employer.'},
  {k:{en:'Open work permit', th:'ใบอนุญาตทำงานแบบเปิด'}, c:'permit', m:['Open Work Permit','open work permit','ใบอนุญาตทำงานแบบเปิด'],
   th:'ใบอนุญาตทำงานที่ไม่ผูกกับนายจ้าง เปลี่ยนงานได้อิสระ เช่น PGWP และใบอนุญาตทำงานของคู่สมรส',
   en:'A work permit not tied to one employer, so you can change jobs freely. Examples: the PGWP and the spouse work permit.'},
  {k:{en:'Off-campus work', th:'ทำงานนอกสถาบัน'}, c:'permit', s:'offc', m:['ทำงานนอกสถาบัน','off campus','off-campus'],
   th:'งานที่ไม่ได้อยู่ในสถาบัน ช่วงที่มีเรียนทำได้สูงสุด 24 ชั่วโมงต่อสัปดาห์ ช่วงปิดเทอมตามตารางทำเต็มเวลาได้ และต้องเริ่มเรียนแล้วจึงทำงานได้',
   en:'Work outside your school: up to 24 hours a week while classes run, full time during scheduled breaks, and only after your program has started.'},
  {k:{en:'Scheduled break', th:'ปิดเทอมตามตาราง'}, c:'permit', s:'offcbrk', m:['ปิดเทอมตามตาราง','Scheduled break','scheduled break'],
   th:'ช่วงหยุดตามปฏิทินของสถาบัน เช่น ปิดเทอมฤดูร้อน ถ้าหยุด 7 วันขึ้นไปและเรียนทั้งก่อนและหลังช่วงนั้น ทำงานเต็มเวลาได้ สูงสุด 180 วันต่อปี',
   en:'A holiday in the school calendar, such as summer. If it lasts 7 days or more and you study before and after it, you may work full time, up to 180 days a year.'},
  {k:'PGWP', f:'Post-Graduation Work Permit', c:'permit', s:'pgwp',
   th:'ใบอนุญาตทำงานแบบเปิดหลังเรียนจบ อายุสูงสุด 3 ปี ใช้สะสมประสบการณ์ทำงานเพื่อยื่น PR ต้องจบหลักสูตรที่มีสิทธิ์ (หลักสูตรวิทยาลัยต้องอยู่ในรายการสาขา) มีผลภาษาตามเกณฑ์ และยื่นภายใน 180 วันหลังเรียนจบ วิทยาลัยเอกชนส่วนใหญ่ไม่มีสิทธิ์',
   en:'An open work permit after graduation, up to 3 years, used to gain work experience for PR. You need an eligible program (college programs must be on the field-of-study list), the language result, and to apply within 180 days of finishing. Most private colleges do not qualify.'},
  {k:{en:'PGWP field-of-study list', th:'รายการสาขาของ PGWP'}, c:'permit', s:'pgwpfos', m:['field-of-study list','field-of-study','รายการสาขาของ PGWP'],
   th:'รายการรหัส CIP ที่ IRCC กำหนดว่าหลักสูตรวิทยาลัยแบบไหนได้ PGWP ส่วนปริญญาตรีและปริญญาโทไม่ต้องอยู่ในรายการ',
   en:"IRCC's list of CIP codes that decides which college programs lead to a PGWP. Bachelor's and master's degrees do not need to be on it."},
  {k:{en:'Spouse work permit', th:'ใบอนุญาตทำงานของคู่สมรส'}, c:'permit', s:'spouse', m:['คู่สมรส','spouse','Spouse'],
   th:'ใบอนุญาตทำงานแบบเปิดสำหรับคู่สมรสหรือคู่ชีวิตของนักศึกษา ปัจจุบันให้เฉพาะคู่ของนักศึกษาปริญญาโทที่หลักสูตรยาว 16 เดือนขึ้นไป ปริญญาเอก หรือหลักสูตรวิชาชีพบางสาขา',
   en:"An open work permit for a student's spouse or common-law partner. Now only for partners of students in master's programs of 16 months or more, doctoral programs, or some professional programs."},
  {k:{en:'Processing time', th:'ระยะเวลาพิจารณา'}, c:'permit', s:'proc', m:['ระยะเวลาพิจารณา','Processing time','processing time'],
   th:'เวลาที่ IRCC ใช้พิจารณาใบสมัคร แอปดึงตัวเลขล่าสุดสำหรับผู้ยื่นจากประเทศไทยจาก IRCC อัตโนมัติทุกวัน',
   en:'How long IRCC takes to decide an application. The app reads the current figure for applicants in Thailand from IRCC each day.'},
  {k:'Bridge Strategy', c:'permit', m:['Bridge Strategy'],
   th:'คำที่แอปนี้ใช้เรียกแผนย้ายจากหลักสูตรเอกชน (ไม่มี PGWP) ไปเรียนต่อสถาบันรัฐเพื่อให้ได้ PGWP และต่อ PR ต้องขอ Study Permit ใหม่ PAL ใหม่ และแสดงเงินรอบใหม่',
   en:"This app's name for moving from a private program (no PGWP) to a public school so you can get a PGWP and aim for PR. It needs a new study permit, a new PAL and new proof of funds."},
  {k:'RCIC', f:'Regulated Canadian Immigration Consultant', c:'permit', s:'rep',
   th:'ที่ปรึกษาการย้ายถิ่นฐานที่มีใบอนุญาตของแคนาดา คนที่รับเงินเพื่อให้คำแนะนำเรื่องวีซ่าต้องเป็น RCIC ทนายความ หรือโนตารีในควิเบก ตรวจชื่อได้ในทะเบียนของ CICC',
   en:'A licensed Canadian immigration consultant. Anyone paid to advise on visas must be an RCIC, a lawyer or a Quebec notary. Check the name in the CICC register.'},
  {k:'CICC', f:'College of Immigration and Citizenship Consultants', c:'permit', s:'rep',
   th:'หน่วยงานที่ออกใบอนุญาตและกำกับดูแลที่ปรึกษาการย้ายถิ่นฐาน (RCIC) มีทะเบียนให้ค้นชื่อได้',
   en:'The regulator that licenses immigration consultants (RCICs). Its public register lets you check a name.'},
  {k:{en:'Education agent', th:'เอเจนต์การศึกษา'}, c:'permit', m:['เอเจนต์','agent'],
   th:'ตัวแทนที่ช่วยเลือกและสมัครสถาบัน ส่วนใหญ่ได้ค่าคอมมิชชันจากโรงเรียน ช่วยเรื่องสมัครเรียนได้ แต่ถ้ารับเงินเพื่อให้คำแนะนำเรื่องวีซ่าต้องเป็น RCIC หรือทนาย',
   en:'Someone who helps you choose and apply to schools, usually paid commission by the school. For paid visa advice they must be an RCIC or a lawyer.'},
  {k:'ICEF', f:'ICEF Agency Status', c:'permit',
   th:'การรับรองเอเจนต์การศึกษาระดับนานาชาติ แสดงว่าเอเจนต์ผ่านการตรวจสอบ แต่ไม่ใช่ใบอนุญาตให้คำแนะนำด้านวีซ่า',
   en:'An international accreditation for education agents. It shows the agent was checked, but it is not a licence to give visa advice.'},
  /* ---- path to PR ---- */
  {k:'PR', f:'Permanent Residency', c:'pr',
   th:'สถานะผู้มีถิ่นที่อยู่ถาวร อยู่ ทำงาน และเรียนที่ไหนในแคนาดาก็ได้ ได้สวัสดิการส่วนใหญ่เหมือนพลเมือง และยื่นขอสัญชาติได้ภายหลัง',
   en:'Permanent residence: live, work and study anywhere in Canada, get most benefits citizens get, and later apply for citizenship.'},
  {k:'Express Entry', c:'pr', s:'draws', m:['Express Entry'],
   th:'ระบบออนไลน์ของ IRCC สำหรับคัดเลือกผู้ยื่น PR กลุ่มแรงงานทักษะ สร้างโปรไฟล์แล้วได้คะแนน CRS จากนั้น IRCC จะส่งคำเชิญให้ยื่น PR เป็นรอบ ๆ ให้คนที่คะแนนถึงเกณฑ์',
   en:"IRCC's online system for skilled-worker PR. You create a profile, get a CRS score, and IRCC invites the top scorers to apply in regular rounds."},
  {k:'CRS', f:'Comprehensive Ranking System', c:'pr', s:'crs',
   th:'คะแนนจัดอันดับใน Express Entry (เต็ม 1,200) คิดจากอายุ การศึกษา ผลภาษา และประสบการณ์ทำงาน ยิ่งสูงยิ่งมีโอกาสได้คำเชิญ',
   en:'The Express Entry score out of 1,200, from age, education, language and work experience. Higher scores get invited first.'},
  {k:{en:'Draw and invitation (ITA)', th:'รอบคัดเลือกและคำเชิญ (ITA)'}, c:'pr', s:'draws', m:['รอบคัดเลือก','คำเชิญ','ITA','draws','draw'],
   th:'รอบคัดเลือกคือครั้งที่ IRCC ส่งคำเชิญ (Invitation to Apply) ให้คนในระบบ Express Entry ที่คะแนน CRS ถึงขั้นต่ำของรอบนั้น ได้คำเชิญแล้วต้องยื่นเอกสาร PR ภายใน 60 วัน',
   en:"A draw is a round in which IRCC sends Invitations to Apply to Express Entry candidates at or above that round's CRS cut-off. You then have 60 days to submit the PR application."},
  {k:{en:'Category-based selection', th:'รอบเฉพาะหมวด'}, c:'pr', s:'eecat', m:['รอบเฉพาะหมวด','Category-based','category-based','Category rounds','category rounds'],
   th:'รอบคัดเลือกที่เชิญเฉพาะคนในอาชีพหรือคุณสมบัติที่แคนาดาต้องการ เช่น Healthcare, STEM หรือ Trades มักใช้คะแนน CRS ต่ำกว่ารอบทั่วไป',
   en:'Draws that invite only people with certain jobs or skills Canada needs, such as healthcare, STEM or trades. Cut-offs are usually lower than general rounds.'},
  {k:'CEC', f:'Canadian Experience Class', c:'pr', s:'cec',
   th:'โปรแกรม PR ใน Express Entry สำหรับคนที่ทำงานเต็มเวลาในแคนาดาอย่างน้อย 1 ปี (1,560 ชั่วโมง) ในงานระดับ TEER 0 ถึง 3 ภายใน 3 ปีที่ผ่านมา งานที่ทำระหว่างเป็นนักศึกษาเต็มเวลาไม่นับ เป็นเส้นทางที่นิยมที่สุดหลังได้ PGWP',
   en:'The Express Entry PR program for people with at least 1 year (1,560 hours) of skilled Canadian work (TEER 0 to 3) in the last 3 years. Work done while a full-time student does not count. The most common route after a PGWP.'},
  {k:'PNP', f:'Provincial Nominee Program', c:'pr', s:'pnp', m:['PNP','Provincial Nominee Program','Provincial Nominee'],
   th:'โปรแกรมที่แต่ละมณฑลคัดเลือกคนที่มณฑลต้องการ แล้วเสนอชื่อ (nominate) ให้ได้ PR ถ้าได้การเสนอชื่อที่ผูกกับ Express Entry จะได้คะแนน CRS เพิ่ม 600',
   en:'Each province picks people it needs and nominates them for PR. A nomination linked to Express Entry adds 600 CRS points.'},
  {k:'BC PNP, OINP, AAIP, SINP, MPNP, NSNP', c:'pr', s:'pnp', m:['BC PNP','OINP','AAIP','SINP','MPNP','NSNP'],
   th:'ชื่อโปรแกรม PNP ของแต่ละมณฑล: BC PNP (บริติชโคลัมเบีย) OINP (ออนแทรีโอ) AAIP (อัลเบอร์ตา) SINP (ซัสแคตเชวัน) MPNP (แมนิโทบา) NSNP (โนวาสโกเชีย)',
   en:"Each province's nominee program: BC PNP (British Columbia), OINP (Ontario), AAIP (Alberta), SINP (Saskatchewan), MPNP (Manitoba), NSNP (Nova Scotia)."},
  {k:'CLB', f:'Canadian Language Benchmarks', c:'pr', s:'lang',
   th:'ระดับภาษาของแคนาดา 1 ถึง 12 แปลงมาจากผลสอบ เช่น IELTS General Training ทุกทักษะ 6.0 เท่ากับ CLB 7 PGWP ต้องการ CLB 7 สำหรับปริญญาตรีขึ้นไป และ CLB 5 สำหรับหลักสูตรวิทยาลัย',
   en:"Canada's language levels from 1 to 12, converted from test scores. For example IELTS General Training 6.0 in every skill is CLB 7. The PGWP needs CLB 7 for a degree and CLB 5 for a college program."},
  {k:'NOC', f:'National Occupational Classification', c:'pr', s:'noc',
   th:'ระบบรหัสอาชีพ 5 หลักของแคนาดา (ฉบับ 2021) บอกว่างานของคุณคืออาชีพอะไรและอยู่ระดับ TEER ไหน ต้องใช้ตอนยื่น PR',
   en:"Canada's 5-digit job codes (2021 version). They say which occupation your job is and its TEER level, which matters for PR."},
  {k:'TEER', f:'Training, Education, Experience and Responsibilities', c:'pr', s:'findnoc',
   th:'ระดับ 0 ถึง 5 ซึ่งเป็นตัวเลขหลักที่ 2 ของรหัส NOC บอกว่างานต้องการการศึกษาหรือประสบการณ์แค่ไหน งาน TEER 0 ถึง 3 นับเป็นงานทักษะสำหรับ CEC',
   en:'Levels 0 to 5, shown by the second digit of a NOC code, saying how much training a job needs. TEER 0 to 3 jobs count as skilled work for the CEC.'},
  {k:'STEM', f:'Science, Technology, Engineering and Mathematics', c:'pr', s:'eecat',
   th:'กลุ่มสาขาวิทยาศาสตร์ เทคโนโลยี วิศวกรรม และคณิตศาสตร์ มักอยู่ในรายการสาขาของ PGWP และเป็นหมวดหนึ่งของรอบเฉพาะหมวดใน Express Entry',
   en:'Science, technology, engineering and mathematics. These fields are usually on the PGWP list and form one of the Express Entry category rounds.'},
  {k:'ECA', f:'Educational Credential Assessment', c:'pr', s:'eca',
   th:'การเทียบวุฒิการศึกษาต่างประเทศ (เช่น ปริญญาจากไทย) กับวุฒิของแคนาดา เพื่อเก็บคะแนนการศึกษาใน Express Entry ต้องทำกับหน่วยงานที่ IRCC กำหนด เช่น WES',
   en:'An assessment that compares a foreign degree (for example from Thailand) with Canadian education, so it earns points in Express Entry. Done by an IRCC-designated body such as WES.'},
  {k:'WES', f:'World Education Services', c:'pr', s:'eca',
   th:'หน่วยงานเทียบวุฒิ (ECA) ที่คนนิยมใช้มากที่สุด', en:'The most widely used ECA organization.'},
  /* ---- study and schools ---- */
  {k:'CIP', f:'Classification of Instructional Programs', c:'study', s:'cip',
   th:'รหัสสาขาวิชาของแคนาดา (เช่น 11.0701 Computer Science) ใช้ตรวจว่าหลักสูตรวิทยาลัยอยู่ในรายการสาขาของ PGWP ไหม ควรขอรหัส CIP 6 หลักจากสถาบันเป็นลายลักษณ์อักษร',
   en:"Canada's code for a field of study (for example 11.0701 Computer Science). It decides whether a college program is on the PGWP list. Ask the school for the 6-digit CIP code in writing."},
  {k:{en:'Public college', th:'วิทยาลัยรัฐ'}, c:'study', m:['วิทยาลัยรัฐ','Public college','public college'], na:['มหา'],
   th:'วิทยาลัยของรัฐ เช่น Seneca, Conestoga, BCIT เปิดหลักสูตร Diploma และ Post-Graduate Diploma จบแล้วขอ PGWP ได้ถ้าสาขาอยู่ในรายการ',
   en:'A government-funded college such as Seneca, Conestoga or BCIT, offering diplomas and post-graduate diplomas. Graduates can get a PGWP if the field is on the list.'},
  {k:{en:'Private career college', th:'วิทยาลัยอาชีพเอกชน'}, c:'study', m:['วิทยาลัยอาชีพเอกชน','Private career college','private career college'],
   th:'โรงเรียนอาชีพเอกชน หลักสูตรสั้นและถูกกว่า มักมี Co-op แต่จบแล้วไม่มีสิทธิ์ PGWP บางแห่งปิดตัวกะทันหัน ควรตรวจสถานะก่อนจ่ายเงิน',
   en:'A private vocational school: shorter, cheaper programs, often with Co-op, but no PGWP. Some have closed suddenly, so check their status before paying.'},
  {k:'Work & Study', c:'study', m:['Work & Study'],
   th:'ชื่อที่เอเจนต์ในไทยใช้เรียกหลักสูตรวิทยาลัยอาชีพเอกชนที่เรียนครึ่งหนึ่งและทำงาน Co-op อีกครึ่งหนึ่ง ไม่ใช่ประเภทวีซ่า',
   en:'A name agents in Thailand use for private college programs with half study and half Co-op work. It is not a visa type.'},
  {k:'Diploma', c:'study', m:['Diploma'],
   th:'หลักสูตรของวิทยาลัย ยาว 1 ถึง 3 ปี (Advanced Diploma ยาว 3 ปี) เน้นทักษะทำงานจริง',
   en:'A college program of 1 to 3 years (an advanced diploma is 3 years), focused on job skills.'},
  {k:'Post-Graduate Diploma', f:'PG Diploma', c:'study', m:['Post-Graduate Diploma','PG Diploma'],
   th:'หลักสูตรของวิทยาลัยสำหรับคนที่จบปริญญาตรีแล้ว ยาว 8 เดือนถึง 2 ปี หลักสูตร 2 ปีขึ้นไปได้ PGWP 3 ปี (ถ้าสาขาอยู่ในรายการ)',
   en:'A college program for people who already have a degree, 8 months to 2 years long. A program of 2 years or more can give a 3-year PGWP if the field is on the list.'},
  {k:{en:"Course-based and thesis master's", th:'ปริญญาโทแบบเรียนรายวิชาและแบบวิทยานิพนธ์'}, c:'study', m:['course-based','thesis'],
   th:'ปริญญาโทแบบเรียนรายวิชา (course-based) เรียนจบเร็วกว่าและมักมี Co-op ส่วนแบบวิทยานิพนธ์ (thesis) เน้นงานวิจัย ทั้งสองแบบถ้ายาว 8 เดือนขึ้นไปได้ PGWP 3 ปี',
   en:"A course-based master's is taught classes, often shorter and often with Co-op; a thesis master's centres on research. Either one of 8 months or more gives a 3-year PGWP."},
  {k:{en:'Intake', th:'รอบเปิดเรียน (Intake)'}, c:'study', m:['รอบเปิดเรียน','Intake','intake'],
   th:'รอบเปิดรับนักศึกษาใหม่ ปกติมีมกราคม พฤษภาคม และกันยายน รอบกันยายนมีหลักสูตรให้เลือกมากที่สุด',
   en:'A start date for new students, usually January, May or September. September has the most programs.'},
  {k:{en:'Tuition deposit', th:'มัดจำค่าเรียน'}, c:'study', m:['มัดจำ','deposit'],
   th:'เงินที่จ่ายให้สถาบันเพื่อยืนยันที่นั่ง มักต้องจ่ายก่อนได้ PAL หรือก่อนยื่นวีซ่า อ่านเงื่อนไขการคืนเงินกรณีวีซ่าไม่ผ่านก่อนจ่าย',
   en:'Money paid to the school to hold your place, usually before you get a PAL or apply for the visa. Read the refund rules for a refused visa before you pay.'},
  {k:{en:'Compulsory school fees', th:'ค่าธรรมเนียมบังคับ'}, c:'study', m:['ค่าธรรมเนียมบังคับ','Compulsory school fees','compulsory school fees','compulsory fees'],
   th:'ค่าใช้จ่ายที่สถาบันเก็บเพิ่มจากค่าเล่าเรียน เช่น ค่ากิจกรรมนักศึกษา ค่าเทคโนโลยี บางที่รวมประกันสุขภาพหรือบัตรโดยสารด้วย ดูยอดได้ใน LOA',
   en:'Charges on top of tuition, such as student union, technology and activity fees; some include health insurance or a transit pass. See your LOA.'},
  {k:'Transcript', c:'study', m:['Transcript','transcript'],
   th:'ใบแสดงผลการเรียนรายวิชาและเกรด ต้องใช้ฉบับภาษาอังกฤษตอนสมัครเรียน', en:'Your official record of courses and grades. You need an English copy to apply.'},
  {k:'Credential', c:'study', m:['credentials','credential','Credential'],
   th:'วุฒิการศึกษาหรือใบรับรองที่ได้หลังเรียนจบ เช่น Diploma หรือปริญญา', en:'The qualification you receive when you finish, such as a diploma or degree.'},
  {k:'Placement, practicum', c:'study', m:['placement','Placement','practicum','Practicum'],
   th:'ช่วงฝึกงานภาคปฏิบัติที่เป็นส่วนหนึ่งของหลักสูตร (ได้หรือไม่ได้ค่าจ้างก็ได้) เช่น ฝึกงานในโรงพยาบาลหรือโรงเรียน',
   en:'Hands-on work training that is part of a program, paid or unpaid, for example in a hospital or a school.'},
  /* ---- English tests ---- */
  {k:'IELTS', f:'International English Language Testing System', c:'test', s:'idp', m:['IELTS Academic','IELTS General Training','IELTS'],

   en:'The most common English test. Academic is for school admission; General Training is the one IRCC accepts for the PGWP and PR (IRCC does not accept Academic). In Thailand it is computer-based, THB 8,860.'},
  {k:'CELPIP-General', f:'Canadian English Language Proficiency Index Program', c:'test', s:'celpip', m:['CELPIP-General','CELPIP'],
   th:'สอบภาษาอังกฤษของแคนาดา สอบด้วยคอมพิวเตอร์จบในครั้งเดียว IRCC รับสำหรับ PGWP และ PR มีศูนย์สอบในไทย ค่าสอบประมาณ THB 7,000',
   en:"Canada's own English test, computer-based in one sitting. IRCC accepts it for the PGWP and PR, and it is offered in Thailand (about THB 7,000)."},
  {k:'PTE', f:'Pearson Test of English', c:'test', s:'pte', m:['PTE Academic','PTE Core','PTE'],
   th:'สอบภาษาอังกฤษของ Pearson ด้วยคอมพิวเตอร์ PTE Academic ใช้สมัครเรียน ส่วน PTE Core ใช้กับ IRCC สำหรับ PGWP และ PR',
   en:"Pearson's computer-based English test. PTE Academic is for admission; PTE Core is the version IRCC accepts for the PGWP and PR."},
  {k:'TOEFL iBT', f:'Test of English as a Foreign Language', c:'test', s:'toefl', m:['TOEFL iBT','TOEFL'],
   th:'สอบภาษาอังกฤษของ ETS หลายสถาบันรับตอนสมัครเรียน แต่ IRCC ไม่รับสำหรับ PGWP และ PR',
   en:"ETS's English test. Many schools accept it for admission, but IRCC does not accept it for the PGWP or PR."},
  {k:'Duolingo English Test', c:'test', s:'det', m:['Duolingo English Test','Duolingo'],
   th:'สอบภาษาอังกฤษออนไลน์ที่บ้าน ราคาถูก บางสถาบันรับ แต่ IRCC ไม่รับ', en:'A cheap online test taken at home. Some schools accept it; IRCC does not.'},
  {k:'TEF, TCF', f:"Test d'évaluation de français, Test de connaissance du français", c:'test', s:'lang', m:['TEF','TCF'],
   th:'สอบภาษาฝรั่งเศสที่ IRCC รับ ถ้ามีผลภาษาฝรั่งเศสดีควบคู่กับภาษาอังกฤษจะได้คะแนน CRS เพิ่ม',
   en:'French tests IRCC accepts. Good French on top of English adds CRS points.'},
  {k:'IDP, British Council', c:'test', s:'idp', m:['British Council','IDP'],
   th:'สองบริษัทที่จัดสอบ IELTS ในประเทศไทย จองสอบได้กับทั้งสองแห่ง', en:'The two organizations that run IELTS in Thailand; you can book with either.'},
  {k:'ETS', f:'Educational Testing Service', c:'test', s:'toefl', th:'องค์กรที่จัดสอบ TOEFL', en:'The organization that runs TOEFL.'},
  /* ---- money, work and tax ---- */
  {k:'CAD, THB, USD', c:'money', a:false,
   th:'รหัสสกุลเงิน: CAD ดอลลาร์แคนาดา, THB บาทไทย, USD ดอลลาร์สหรัฐ ตัวเลขในแอปแปลงด้วยอัตราแลกเปลี่ยนล่าสุดของวันนี้',
   en:"Currency codes: CAD Canadian dollar, THB Thai baht, USD US dollar. The app converts with today's live exchange rate."},
  {k:'SIN', f:'Social Insurance Number', c:'money', s:'sin',

   en:'The 9-digit number you need before you can be paid. Get it free from Service Canada (in person or online) after you arrive; your study permit must show you may work.'},
  {k:'CPP', f:'Canada Pension Plan', c:'money', s:'payroll',
   th:'เงินสมทบกองทุนบำนาญของรัฐ หักจากค่าจ้างทุกงวด 5.95% ของค่าจ้างส่วนที่เกิน CAD 3,500 ต่อปี (อัตราปี 2026)',
   en:"Canada's public pension. 5.95% of pay above CAD 3,500 a year is taken from each paycheque (2026 rate)."},
  {k:'EI', f:'Employment Insurance', c:'money', s:'payroll',
   th:'ประกันการจ้างงาน คล้ายประกันสังคมกรณีว่างงานของไทย หัก 1.63% ของค่าจ้าง (อัตราปี 2026)',
   en:'Employment insurance, which pays benefits if you lose your job. 1.63% of pay is taken (2026 rate).'},
  {k:'CRA', f:'Canada Revenue Agency', c:'money', s:'tuitioncr',
   th:'กรมสรรพากรของแคนาดา ยื่นภาษีทุกปีภายใน 30 เมษายน นักศึกษาส่วนใหญ่ได้ภาษีที่ถูกหักไว้คืนบางส่วน',
   en:"Canada's tax agency. File a tax return each year by 30 April; most students get some of the withheld tax back."},
  {k:{en:'Take-home pay', th:'รายได้สุทธิ'}, c:'money', s:'payroll', m:['รายได้สุทธิ','Take-home pay','take-home pay'],
   th:'เงินที่เข้าบัญชีจริงหลังหัก CPP EI และภาษี แอปนี้คิด 93% ของรายได้ถ้าไม่เกิน CAD 1,700 ต่อเดือน และลดลงถึง 80% เมื่อรายได้สูงขึ้น',
   en:'What reaches your bank after CPP, EI and tax. This app uses 93% of pay up to CAD 1,700 a month, falling to 80% at higher pay.'},
  {k:{en:'Gross pay', th:'รายได้ก่อนหัก'}, c:'money', m:['รายได้ก่อนหัก','before deductions','Gross pay','gross pay'],
   th:'ค่าจ้างเต็มจำนวนก่อนหักอะไรเลย คือ ชั่วโมงทำงาน × ค่าจ้างต่อชั่วโมง', en:'Your full pay before anything is taken off: hours × hourly wage.'},
  {k:{en:'Minimum wage', th:'ค่าแรงขั้นต่ำ'}, c:'money', s:'minw', m:['ค่าแรงขั้นต่ำ','Minimum wage','minimum wage'],
   th:'ค่าจ้างต่ำสุดต่อชั่วโมงที่นายจ้างต้องจ่าย แต่ละมณฑลกำหนดเอง ในมณฑลที่แอปนี้ครอบคลุม ปี 2026 อยู่ระหว่าง CAD 15.00 (อัลเบอร์ตา) ถึง 18.25 (บริติชโคลัมเบีย)',
   en:'The lowest hourly pay an employer may offer, set by each province. In the provinces this app covers it ranges from CAD 15.00 (Alberta) to 18.25 (British Columbia) in 2026.'},
  {k:{en:'Median wage', th:'ค่ามัธยฐานค่าจ้าง'}, c:'money', s:'wages', m:['ค่ามัธยฐาน','median','Median'],
   th:'ค่าจ้างตรงกลาง คือมีคนได้มากกว่าครึ่งหนึ่งและน้อยกว่าครึ่งหนึ่ง ใช้ดูค่าจ้างทั่วไปได้ดีกว่าค่าเฉลี่ย',
   en:'The middle wage: half of workers earn more and half earn less. A fairer guide to typical pay than the average.'},
  {k:{en:'Tuition tax credit', th:'สิทธิ์ลดหย่อนค่าเล่าเรียน'}, c:'money', s:'tuitioncr', m:['tuition credit','ลดหย่อนค่าเล่าเรียน'],
   th:'นักศึกษาที่เป็นผู้มีถิ่นที่อยู่ทางภาษีในแคนาดานำค่าเล่าเรียนไปลดภาษีได้ ใช้แบบฟอร์ม T2202 ที่สถาบันออกให้',
   en:'Students who are Canadian tax residents can use their tuition to reduce income tax, with the T2202 form from the school.'},
  {k:{en:'Break-even hours', th:'ชั่วโมงคุ้มทุน'}, c:'money', m:['ชั่วโมงคุ้มทุน','Break-even','break-even'],
   th:'จำนวนชั่วโมงทำงานต่อสัปดาห์ที่ทำให้รายได้สุทธิเท่ากับค่าครองชีพพอดี', en:'The weekly work hours at which take-home pay exactly equals living costs.'},
  {k:{en:'Setup reserve', th:'เงินสำรองตั้งตัว'}, c:'money', m:['เงินสำรองตั้งตัว','Setup reserve','setup reserve'],
   th:'เงินที่ควรเตรียมไว้ใช้ช่วงแรกที่ไปถึง เช่น เงินประกันห้อง ของใช้ในบ้าน และเสื้อกันหนาว แอปตั้งไว้ CAD 2,000 แก้เองได้ในหน้างบ',
   en:'Money for your first weeks: a rent deposit, household items and winter clothes. The app uses CAD 2,000; you can change it in the simulator.'},
  {k:'Job Bank', c:'money', s:'wages', m:['Job Bank'],
   th:'เว็บหางานและข้อมูลค่าจ้างของรัฐบาลแคนาดา ดูค่าจ้างของแต่ละอาชีพในแต่ละเมืองได้', en:"The Government of Canada's job board and wage data, by occupation and city."},
  /* ---- health insurance ---- */
  {k:'MSP', f:'Medical Services Plan, British Columbia', c:'health', s:'h_BC',

   en:"British Columbia's public health plan. Students with a study permit of 6 months or more must enrol and pay CAD 75 a month; private cover is needed during the waiting period (arrival month plus 2 months)."},
  {k:'OHIP', f:'Ontario Health Insurance Plan', c:'health',
   th:'ประกันสุขภาพของรัฐออนแทรีโอ นักศึกษาต่างชาติไม่มีสิทธิ์ สถาบันจะให้เข้าแผนประกันของสถาบันแทน',
   en:"Ontario's public health plan. International students are not eligible; schools enrol them in their own plan."},
  {k:'UHIP', f:'University Health Insurance Plan', c:'health', s:'uhip',
   th:'ประกันสุขภาพที่มหาวิทยาลัยในออนแทรีโอให้นักศึกษาต่างชาติซื้อ ประมาณปีละ CAD 935 ถึง 950',
   en:'The plan Ontario universities require international students to buy, about CAD 935 to 950 a year.'},
  {k:'AHCIP', f:'Alberta Health Care Insurance Plan', c:'health',
   th:'ประกันสุขภาพของรัฐอัลเบอร์ตา ไม่มีเบี้ย นักศึกษาที่มี Study Permit 12 เดือนลงทะเบียนได้',
   en:"Alberta's public health plan. No premium; students with a 12-month study permit can register."},
  {k:'RAMQ', f:"Régie de l'assurance maladie du Québec", c:'health',
   th:'ประกันสุขภาพของรัฐควิเบก นักศึกษาไทยไม่มีสิทธิ์ ต้องซื้อประกันของสถาบัน', en:"Quebec's public health plan. Thai students are not eligible and must buy the school plan."},
  {k:'MSI', f:'Medical Services Insurance, Nova Scotia', c:'health',
   th:'ประกันสุขภาพของรัฐโนวาสโกเชีย นักศึกษาที่มี Study Permit 12 เดือนขึ้นไปได้สิทธิ์ตั้งแต่เดือนที่ 13 ปีแรกต้องใช้ประกันของสถาบัน',
   en:"Nova Scotia's public health plan. Students with a permit of 12 months or more are covered from month 13; use the school plan for the first year."},

        {en:'Documents that usually need translating (Bangkok visa office checklist): birth certificate (proof of relationship to your sponsor), marriage and name-change certificates, employer letters, tax documents, company certificates and passbooks. [[imm5819]]', th:'เอกสารที่มักต้องแปล (ตามเช็กลิสต์ของสำนักงานวีซ่ากรุงเทพฯ): สูติบัตร (หลักฐานความสัมพันธ์กับสปอนเซอร์) ทะเบียนสมรส ใบเปลี่ยนชื่อ หนังสือรับรองการทำงาน เอกสารภาษี หนังสือรับรองบริษัท และสมุดบัญชีเงินฝาก [[imm5819]]'},

        {en:'Biometrics: book an appointment first (booking is free). Bring the Biometric Instruction Letter, the VFS consent form and your passport. The CAD 85 biometrics fee is paid to IRCC online and already includes one document transmission, so VFS charges nothing extra. [[vfsfees]]', th:'Biometrics: ต้องจองคิวก่อน (จองฟรี) นำจดหมายแจ้งเก็บ Biometrics แบบฟอร์มยินยอมของ VFS และพาสปอร์ตไปด้วย ค่า Biometrics CAD 85 จ่ายให้ IRCC ทางออนไลน์ และรวมค่าส่งเอกสาร 1 ครั้งแล้ว VFS จึงไม่เก็บเงินเพิ่ม [[vfsfees]]'},

        {en:'Where: only an IRCC panel physician. Use IRCC\'s search tool (choose Canada and your province), then phone the clinic to book. [[panel]]', th:'ตรวจที่ไหน: เฉพาะแพทย์ที่ IRCC รับรอง (panel physician) ค้นหาด้วยเครื่องมือของ IRCC เลือกประเทศ Canada และมณฑล แล้วโทรจองคลินิก [[panel]]'},
        {en:'Bring: your passport (or other valid ID), glasses or contact lenses, past medical reports, a list of your medicines, and 4 photos if the clinic does not use eMedical. [[medpr]]', th:'สิ่งที่ต้องนำไป: พาสปอร์ต (หรือบัตรประจำตัวที่ยังไม่หมดอายุ) แว่นตาหรือคอนแทกเลนส์ รายงานผลตรวจเดิม รายชื่อยาที่ใช้อยู่ และรูปถ่าย 4 ใบถ้าคลินิกไม่ใช้ระบบ eMedical [[medpr]]'},
        {en:'What happens: health questions, a physical exam (height, weight, hearing, vision, heart, lungs), a chest X-ray from age 11, and blood tests including syphilis and HIV from age 15. You may ask for a chaperone. [[medpr]] [[panelguide]]', th:'ตรวจอะไรบ้าง: ซักประวัติสุขภาพ ตรวจร่างกาย (ส่วนสูง น้ำหนัก การได้ยิน สายตา หัวใจ ปอด) เอกซเรย์ปอดตั้งแต่อายุ 11 ปี และตรวจเลือด เช่น ซิฟิลิสและ HIV ตั้งแต่อายุ 15 ปี ขอให้มีผู้อยู่ด้วยระหว่างตรวจได้ [[medpr]] [[panelguide]]'},
        {en:'Cost: IRCC sets no fee. You pay the clinic on the day, and it is not refunded if the application is refused. Two Ontario clinics list about CAD 240 to 275 for an adult including X-ray and lab tests; phone to confirm. [[medpr]]', th:'ค่าใช้จ่าย: IRCC ไม่ได้กำหนดราคา จ่ายให้คลินิกในวันตรวจ และไม่คืนเงินแม้ใบสมัครไม่ผ่าน คลินิกในออนแทรีโอ 2 แห่งประกาศราคาผู้ใหญ่รวมเอกซเรย์และค่าแล็บประมาณ CAD 240 ถึง 275 ควรโทรถามก่อน [[medpr]]'},
        {en:'After the exam the doctor gives you an eMedical Information Sheet to upload with your PR application. [[eepr]]', th:'หลังตรวจ แพทย์จะให้ eMedical Information Sheet ไว้อัปโหลดพร้อมใบสมัคร PR [[eepr]]'},
        {en:'Maybe no new exam: if you live in Canada and passed an IRCC medical (for example for your study permit) within the last 5 years, enter its number on the application; the officer may accept it (temporary policy to 5 October 2029, not guaranteed). [[imeexempt]]', th:'อาจไม่ต้องตรวจใหม่: ถ้าอยู่ในแคนาดาและเคยตรวจสุขภาพกับ IRCC แล้วผ่าน (เช่น ตอนขอ Study Permit) ภายใน 5 ปี ให้ใส่เลขที่ผลตรวจเดิมในใบสมัคร เจ้าหน้าที่อาจยอมรับได้ (นโยบายชั่วคราวถึง 5 ตุลาคม 2029 ไม่รับประกัน) [[imeexempt]]'}

      {t:{en:'Police certificate from Thailand', th:'ใบรับรองความประพฤติจากตำรวจไทย'}, thb:[100,600], off:true, r:'pccth',

        {en:'Who issues it: the Police Clearance Service Center, Special Branch Bureau, Royal Thai Police (online at pcscenter.online). [[pccth]] [[pccthp]]', th:'ผู้ออก: ศูนย์บริการหนังสือรับรองความประพฤติ กองบัญชาการตำรวจสันติบาล สำนักงานตำรวจแห่งชาติ (ระบบออนไลน์ pcscenter.online) [[pccth]] [[pccthp]]'},
        {en:'If you are in Thailand: register and book online, then go in person with your ID card and passport. Fee 100 THB (collect yourself) or 160 THB (by post). About 15 working days, or 25 if a record is found. [[pccthp]]', th:'ถ้าอยู่ไทย: ลงทะเบียนและจองคิวออนไลน์ แล้วไปยื่นด้วยตัวเองพร้อมบัตรประชาชนและพาสปอร์ตตัวจริง ค่าธรรมเนียม 100 บาท (รับเอง) หรือ 160 บาท (ส่งไปรษณีย์) ใช้เวลาประมาณ 15 วันทำการ หรือ 25 วันถ้ามีประวัติ [[pccthp]]'},
        {en:'If you are in Canada: get 2 sets of fingerprints from local police or an RCMP-accredited fingerprinting company, add certified copies of your passport, ID card and house registration and 2 photos, then mail them to the centre or let someone in Thailand apply for you. Fee 100 THB with a prepaid return envelope, or 600 THB including return postage; 15 to 25 working days plus mail time. [[pccabroad]] [[rcmpfp]]', th:'ถ้าอยู่แคนาดา: พิมพ์ลายนิ้วมือ 2 ชุดที่ตำรวจท้องถิ่นหรือบริษัทที่ RCMP รับรอง แนบสำเนาพาสปอร์ต บัตรประชาชน และทะเบียนบ้านที่รับรองสำเนา รูปถ่าย 2 ใบ แล้วส่งไปรษณีย์ไปที่ศูนย์ หรือมอบอำนาจให้คนที่ไทยยื่นแทน ค่าธรรมเนียม 100 บาทถ้าแนบซองตอบกลับที่ติดแสตมป์แล้ว หรือ 600 บาทรวมค่าส่งกลับ ใช้เวลา 15 ถึง 25 วันทำการบวกเวลาส่งไปรษณีย์ [[pccabroad]] [[rcmpfp]]'},
        {en:'Check first: official pages give different mailing addresses for the centre, so confirm the current address on pcscenter.online before sending. Fingerprint prices are in the next line. [[pccthp]]', th:'ตรวจก่อนส่ง: หน้าเว็บทางการแต่ละแห่งระบุที่อยู่ของศูนย์ไม่ตรงกัน ควรยืนยันที่อยู่ล่าสุดบน pcscenter.online ก่อนส่ง ราคาค่าพิมพ์ลายนิ้วมือดูได้ในรายการถัดไป [[pccthp]]'},
        {en:'Upload a colour scan of the original with a certified English translation. If it is late, upload a letter of explanation with proof you asked for it (receipt, payment or tracking number). [[pccee]]', th:'อัปโหลดสแกนสีจากตัวจริง พร้อมคำแปลภาษาอังกฤษที่รับรอง ถ้ายังไม่ได้รับ ให้แนบจดหมายอธิบายพร้อมหลักฐานว่ายื่นขอแล้ว (ใบเสร็จ หลักฐานการจ่ายเงิน หรือเลขพัสดุ) [[pccee]]'}
       ]},
      {t:{en:'Fingerprints in Canada for the Thai police certificate (2 ink cards)', th:'ค่าพิมพ์ลายนิ้วมือในแคนาดาสำหรับใบรับรองความประพฤติไทย (2 ชุด แบบหมึก)'}, cad:[65,125], r:'rcmpfp',
       n:{en:'Only if you apply from Canada; most cost about CAD 80 to 110 with tax', th:'เฉพาะกรณียื่นจากแคนาดา ส่วนใหญ่ประมาณ CAD 80 ถึง 110 รวมภาษี'},
       how:[
        {en:'What to ask for: 2 sets of ink-and-roll fingerprints on fingerprint cards, signed and stamped by the official, "for a foreign police certificate (Thailand)". Digital (LiveScan) prints are not what the Thai police ask for. [[pccabroad]]', th:'ขออะไร: ลายนิ้วมือแบบหมึก (ink and roll) 2 ชุดบนบัตรลายนิ้วมือ มีลายเซ็นและตราประทับของเจ้าหน้าที่ บอกผู้ให้บริการว่า "for a foreign police certificate (Thailand)" ลายนิ้วมือแบบดิจิทัล (LiveScan) ไม่ใช่สิ่งที่ตำรวจไทยขอ [[pccabroad]]'},
        {en:'Thai missions do not take fingerprints: the Embassy in Ottawa and the Consulate-General in Vancouver point you to RCMP-accredited companies (the Toronto, Montreal, Edmonton and Calgary honorary consulates are closed). [[thvanpcc]] [[rcmpfp]]', th:'สถานทูตและสถานกงสุลไทยไม่ได้รับพิมพ์ลายนิ้วมือ: สถานทูตที่ออตตาวาและสถานกงสุลใหญ่ที่แวนคูเวอร์แนะนำให้ใช้บริษัทที่ RCMP รับรอง (สถานกงสุลกิตติมศักดิ์ที่โตรอนโต มอนทรีออล เอดมันตัน และแคลกะรีปิดอยู่) [[thvanpcc]] [[rcmpfp]]'},
        {en:'City police: Edmonton $50 for the first set and $15 for each extra (2 sets $65); Winnipeg $81.90 with GST for 1 or 2 sets. Vancouver police do digital only, and Calgary, Toronto and Ottawa police send you to private companies. [[eps]] [[wps]] [[vpdfp]] [[tpsfp]]', th:'ตำรวจเมือง: เอดมันตัน ชุดแรก $50 ชุดต่อไป $15 (2 ชุด $65) วินนิเพก $81.90 รวม GST สำหรับ 1 หรือ 2 ชุด ตำรวจแวนคูเวอร์ทำเฉพาะแบบดิจิทัล ส่วนตำรวจแคลกะรี โตรอนโต และออตตาวาให้ไปใช้บริษัทเอกชน [[eps]] [[wps]] [[vpdfp]] [[tpsfp]]'},
        {en:'Example prices from RCMP-accredited companies (examples only, not recommendations; pages show no date, so phone first): Toronto: Fingerprints Plus about $90 with tax for 2 cards, Forensics Canada from $44 plus tax for one. Ottawa: Gambit ID $95 plus HST. Calgary: Frontier One $125 with tax for 2 sets, The Fingerprint Room from $60 plus GST (also in Richmond BC). Montreal: Commissionnaires du Québec $45 plus taxes a card. Vancouver: Commissionaires BC and others do ink prints but post no price. [[fpplus]] [[forensicsca]] [[gambit]] [[f1fp]] [[fproom]] [[cmqc]]', th:'ตัวอย่างราคาบริษัทที่ RCMP รับรอง (เป็นตัวอย่างเท่านั้น ไม่ใช่การแนะนำ หน้าเว็บไม่ระบุวันที่ ควรโทรถามก่อน): โตรอนโต: Fingerprints Plus 2 ชุดประมาณ $90 รวมภาษี Forensics Canada เริ่ม $44 บวกภาษีต่อชุด ออตตาวา: Gambit ID $95 บวก HST แคลกะรี: Frontier One 2 ชุด $125 รวมภาษี The Fingerprint Room เริ่ม $60 บวก GST (มีที่ริชมอนด์ BC ด้วย) มอนทรีออล: Commissionnaires du Québec บัตรละ $45 บวกภาษี แวนคูเวอร์: Commissionaires BC และบริษัทอื่นทำแบบหมึกได้แต่ไม่ประกาศราคา [[fpplus]] [[forensicsca]] [[gambit]] [[f1fp]] [[fproom]] [[cmqc]]'},
        {en:'Summary: 2 ink cards cost about CAD 65 to 125, most often about 80 to 110 with tax. Find a company near you on the RCMP list (281 locations, updated monthly). [[rcmpfp]]', th:'สรุป: 2 ชุดแบบหมึกประมาณ CAD 65 ถึง 125 ส่วนใหญ่ประมาณ 80 ถึง 110 รวมภาษี ค้นหาบริษัทใกล้บ้านได้จากรายชื่อของ RCMP (281 แห่ง อัปเดตทุกเดือน) [[rcmpfp]]'}
       ]},
      {t:{en:'Biometrics for PR (again)', th:'Biometrics สำหรับ PR (เก็บใหม่)'}, cad:[85,85], off:true, u:FEES_URL, r:'biopr', n:{en:'Required with every PR application', th:'ต้องเก็บใหม่ทุกครั้งที่ยื่น PR'}}
    ]}

/* ============================== VIEWS ============================== */
const tabL = id => UI.tabs.find(t => t.id === id).l;

function viewStart(){
  const A = START, done = A.steps.filter(s => S.steps[s.id]).length, pct = Math.round(done/A.steps.length*100);
  const steps = A.steps.map((s,i) => `
    <div class="tl-step">
      <div class="tl-dot ${S.steps[s.id]?'goal':''}">${S.steps[s.id]?ic('check','icon-sm'):i+1}</div>
      <div class="card">
        
        <span class="badge b-blue">${ic('clock','icon-sm')}${T(s.m)}${i<9?' '+T(A.before):''}</span>
        
        <h2 class="text-[18px] font-semibold mt-3 flex items-start gap-2"><span style="color:var(--blue);margin-top:4px">${ic(s.icon)}</span><span>${T(s.t)}</span></h2>
        
        <ul class="clean mt-2">${s.d.map(x => `<li><span style="color:var(--ink3)">${ic('chevron-right','icon-sm')}</span><span>${T(x)}</span></li>`).join('')}</ul>
        
        <div class="mt-3 text-[14.5px] flex gap-2" style="background:var(--bg);border-radius:8px;padding:8px 12px"><span style="color:var(--green)">${ic('banknote','icon-sm')}</span><span><strong>${T(A.cost)}:</strong> <span class="num">${T(s.c)}</span></span></div>
        
        <div class="flex flex-wrap gap-2 mt-3">
        
          ${s.go?`<button class="btn btn-primary" style="padding:7px 16px;font-size:14px" data-act="tab" data-v="${s.go.tab}" ${s.go.anchor?`data-anchor="${s.go.anchor}"`:''}>${T(s.go.l)}${ic('arrow-right','icon-sm')}</button>`:''}
        
          ${s.link?`<a class="btn btn-ghost" style="font-size:14px" href="${s.link}" target="_blank" rel="noopener noreferrer">${ic('external-link','icon-sm')}${T({en:'Official page', th:'หน้าเว็บทางการ'})}</a>`:''}
        
        </div>
        
        <label class="check tap text-[15px] font-medium mt-3" style="display:flex;align-items:center;padding:10px 0 0;border-top:1px solid var(--line);width:100%"><input type="checkbox" style="margin:0" data-step="${s.id}" ${S.steps[s.id]?'checked':''}>${T(A.done)}</label>
      </div>
    </div>`).join('');
  return `
    <section class="mb-8" style="max-width:820px">
      <h1 class="text-[28px] sm:text-[42px] font-bold">${T(A.h1)}</h1>
      <p class="muted text-[17px] mt-4" style="max-width:62ch">${T(A.lead)}</p>
    </section>
    <div class="grid lg:grid-cols-3 gap-6 items-start">
      <div class="lg:col-span-2">
        
        <div class="card mb-6">
        
          <div class="flex justify-between text-[14px] mb-2"><span class="muted">${T(A.progress)}</span><span class="num font-semibold">${done} / ${A.steps.length}</span></div>
        
          <div class="bar"><i style="width:${pct}%;background:var(--green)"></i></div>
        
        </div>
        
        <div class="tl">${steps}</div>
      </div>
      <div class="grid gap-6">
      <div class="card">${liveCard()}</div>
      <div class="card">
        
        <h2 class="text-[18px] font-semibold mb-1">${T(A.glossT)}</h2>

        ${['DLI','LOA','PAL','Study Permit','Co-op','PGWP','SIN','PR'].map(k => GLOSS.find(e => e.k === k)).filter(Boolean).map(e => `<div class="py-2" style="border-top:1px solid var(--line)"><div class="font-semibold text-[14.5px]">${esc(gk(e))}${e.f ? ` <span class="faint font-normal text-[12.5px]">${esc(e.f)}</span>` : ''}</div><div class="muted text-[14px]">${esc(gtxt(e))}</div></div>`).join('')}
        <button class="btn btn-ghost mt-2" style="font-size:14px" data-act="gloss-open">${ic('book-search','icon-sm')}${T(GLOSS_UI.seeAll)(GLOSS.length)}</button>
      </div>
      </div>
    </div>`;
}

function costRange(it){ const r = S.sim.rate || 24; return it.cad ? it.cad : [it.thb[0]/r, it.thb[1]/r]; }
function viewCosts(){
  const C = COSTS, r = S.sim.rate || 24;
  let tMin = 0, tMax = 0;
  const secs = C.secs.map(sec => {
    let a = 0, b = 0;
    const rows = sec.items.map(it => {
      const m = it.cad ? money(it.cad[0], it.cad[1], 'cad') : money(it.thb[0], it.thb[1], 'thb');
      const cr = costRange(it); a += cr[0]; b += cr[1];
      return `
        
        <div class="trow">
        
          <div>
        
            <div class="font-medium text-[15px]">${T(it.t)}${it.r ? ` [[${it.r}]]` : (it.u ? (k => k ? ` [[${k}]]` : '')(Object.keys(SRC).find(k => SRC[k].u === it.u)) : '')}</div>
        
            <div class="flex flex-wrap items-center gap-2 mt-1">
        
              <span class="badge ${it.off?'b-green':'b-gray'}">${T(it.off?C.off:C.est)}</span>
        
              ${it.n?`<span class="faint text-[13px]">${T(it.n)}</span>`:''}
        
              ${it.u?`<a href="${it.u}" target="_blank" rel="noopener noreferrer" class="tap text-[14px] inline-flex items-center gap-1 hover:underline" style="color:var(--blue)">${ic('external-link','icon-sm')}${T(C.verify)}</a>`:''}

            </div>
            ${it.how ? `<details class="how mt-2" data-field="how-${it.t.en.replace(/[^A-Za-z0-9]+/g,'-')}" ${S.open && S.open['how-' + it.t.en.replace(/[^A-Za-z0-9]+/g,'-')] ? 'open' : ''}><summary class="text-[13.5px] font-medium cursor-pointer" style="color:var(--blue)">${ic('info','icon-sm')} ${T(it.howT || C.howT)}</summary>
              <ol class="howlist">${it.how.map(x => `<li>${T(x)}</li>`).join('')}</ol></details>` : ''}

          </div>
        
          <div class="amt"><span class="cur faint text-[12px]">CAD </span>${m.cad}</div>
        
          <div class="amt"><span class="cur faint text-[12px] font-normal">THB </span>${m.thb}</div>
        
        </div>`;
    }).join('');
    if (sec.sum) { tMin += a; tMax += b; }
    const sm = money(rnd(a,5), rnd(b,5), 'cad');
    return `
      <section>
        
        <h2 class="grp">${T(sec.t)}</h2>
        
        <div class="card tbl">
        
          <div class="thead"><div>${T(C.item)}</div><div>CAD</div><div>THB</div></div>
        
          ${rows}
        
          <div class="trow total">
        
            <div>${T(C.sub)}</div>
        
            <div class="amt"><span class="cur faint text-[12px] font-normal">CAD </span>${sm.cad}</div>
        
            <div class="amt"><span class="cur faint text-[12px] font-normal">THB </span>${sm.thb}</div>
        
          </div>
        
        </div>
      </section>`;
  }).join('');
  const tot = money(rnd(tMin,10), rnd(tMax,10), 'cad'), show = simCalc().show;
  return `
    <section class="mb-6" style="max-width:820px">
      <h1 class="text-[30px] sm:text-[38px] font-bold">${T(C.h1)}</h1>
      <p class="muted mt-3 text-[17px]">${T(C.lead)}</p>
    </section>
    <div class="grid lg:grid-cols-3 gap-4 mb-4">
      <div class="card">
        
        <div class="eyebrow mb-2">${T(C.conv)}</div>
        
        <div class="flex items-center gap-2 mb-2"><span class="faint text-[13px] w-10">CAD</span><input class="numin num" style="width:100%" type="number" min="0" inputmode="decimal" aria-label="CAD" id="conv-cad" data-conv="cad" value="1000"></div>
        
        <div class="flex items-center gap-2"><span class="faint text-[13px] w-10">THB</span><input class="numin num" style="width:100%" type="number" min="0" inputmode="decimal" aria-label="THB" id="conv-thb" data-conv="thb" value="${Math.round(1000*r)}"></div>
        
        <div class="faint text-[13px] mt-3" id="fx-status"></div>
      </div>
      <div class="card">
